<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-24 | لوحة تحكم المالك</title>
    <style>
        :root {
            --bg-primary: #0B0B10;
            --bg-card: #151522;
            --accent-gold: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #EF4444;
            --success: #10B981;
            --wa-color: #25D366;
            --fb-color: #1877F2;
            --tg-color: #0088CC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 12px; padding-bottom: 50px; }

        .container { max-width: 480px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .header h2 { color: var(--accent-gold); font-size: 15px; }
        .back-store-btn { background: var(--bg-card); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; text-decoration: none; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .card h3 { font-size: 12px; color: var(--accent-gold); margin-bottom: 8px; }

        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-size: 9px; color: var(--text-muted); margin-bottom: 3px; }
        .form-control { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 6px; font-size: 11px; outline: none; }
        .form-control:focus { border-color: var(--accent-gold); }

        .btn-primary { width: 100%; background: var(--accent-gold); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; margin-top: 6px; }
        .btn-cancel { width: 100%; background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer; margin-top: 4px; display: none; }

        .products-list { display: flex; flex-direction: column; gap: 8px; }
        .admin-product-item { background: var(--bg-primary); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; }
        
        .admin-product-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .admin-product-info h4 { font-size: 11px; color: #fff; margin-bottom: 2px; }
        .admin-product-info span { font-size: 10px; color: var(--accent-gold); font-weight: bold; }
        
        .admin-actions { display: flex; gap: 4px; }
        .btn-edit { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); padding: 3px 8px; border-radius: 4px; font-size: 9px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 3px 8px; border-radius: 4px; font-size: 9px; cursor: pointer; font-weight: bold; }

        .social-share-box { display: flex; gap: 4px; border-top: 1px solid var(--border-color); padding-top: 6px; }
        .social-btn { flex: 1; font-size: 9px; padding: 4px 2px; border-radius: 4px; text-align: center; text-decoration: none; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; gap: 2px; }
        .s-wa { background: rgba(37, 211, 102, 0.15); border: 1px solid var(--wa-color); color: var(--wa-color); }
        .s-fb { background: rgba(24, 119, 242, 0.15); border: 1px solid var(--fb-color); color: var(--fb-color); }
        .s-tg { background: rgba(0, 136, 204, 0.15); border: 1px solid var(--tg-color); color: var(--tg-color); }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; color: var(--accent-gold); font-size: 12px; font-weight: bold; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div id="loadingOverlay">⏳ جاري ضغط ومعالجة الصور والفيديو، ثوانٍ معدودة...</div>

    <div class="container">
        <div class="header">
            <h2>⚙️ لوحة تحكم المالك</h2>
            <a href="index.html" class="back-store-btn" target="_blank">عرض المتجر 🛒</a>
        </div>

        <div class="card">
            <h3 id="formTitle">➕ إضافة منتج جديد</h3>
            <input type="hidden" id="editingId" value="">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="pName" class="form-control" placeholder="مثال: ساعة ذكية أصلية">
            </div>
            <div class="form-group">
                <label>السعر (بالجنيه):</label>
                <input type="number" id="pPrice" class="form-control" placeholder="مثال: 750">
            </div>
            <div class="form-group">
                <label>اختر القسم:</label>
                <select id="pCategory" class="form-control">
                    <option value="أدوات منزلية">🚿 أدوات منزلية</option>
                    <option value="إلكترونيات">⚡ إلكترونيات</option>
                    <option value="ملابس">👕 ملابس</option>
                    <option value="مستلزمات حيوانات أليفة">🐾 مستلزمات حيوانات أليفة</option>
                    <option value="الصحة والجمال">💄 الصحة والجمال</option>
                    <option value="أجهزة كمبيوتر">💻 أجهزة كمبيوتر</option>
                    <option value="عروض خاصة">🔥 عروض خاصة</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>اختر صور المنتج (من 1 إلى 10 صور - ضغط تلقائي):</label>
                <input type="file" id="pImageFiles" class="form-control" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label>اختر فيديو للمنتج (فيديو واحد - اختياري):</label>
                <input type="file" id="pVideoFile" class="form-control" accept="video/*">
            </div>

            <div class="form-group">
                <label>وصف المنتج:</label>
                <textarea id="pDesc" class="form-control" rows="2" placeholder="تفاصيل ومميزات المنتج..."></textarea>
            </div>
            <button class="btn-primary" id="saveBtn" onclick="processAndSaveProduct()">نشر المنتج الآن 🚀</button>
            <button class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">إلغاء التعديل ✕</button>
        </div>

        <div class="card">
            <h3>📦 إدارة المنتجات الحالية (<span id="totalAdminCount">0</span>)</h3>
            <div class="products-list" id="adminProductsList"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadAdminProducts);
        let temporaryMediaCache = { images: [], video: null };

        function getProducts() {
            let data = localStorage.getItem('store_products');
            return data ? JSON.parse(data) : [];
        }

        function saveProducts(products) {
            localStorage.setItem('store_products', JSON.stringify(products));
        }

        function loadAdminProducts() {
            let products = getProducts();
            document.getElementById('totalAdminCount').innerText = products.length;
            let container = document.getElementById('adminProductsList');

            if (products.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 10px; padding: 10px;">لا توجد منتجات مضافة حالياً.</p>`;
                return;
            }

            container.innerHTML = products.map(p => {
                let shareText = encodeURIComponent(`🔥 لا يفوتك هذا العرض: *${p.name}* \n💰 السعر: ${p.price} ج.م\n📂 القسم: ${p.category || 'عام'}\n📝 التفاصيل: ${p.desc || 'منتج عالي الجودة'}`);
                let imgCount = (p.images || []).length;
                let hasVid = p.video ? ' | 🎥 يوجد فيديو' : '';
                
                return `
                    <div class="admin-product-item">
                        <div class="admin-product-header">
                            <div class="admin-product-info">
                                <h4>${p.name}</h4>
                                <span>${p.price} ج.م | <em style="color:#aaa;">${p.category || 'عام'}</em> | 🖼️ ${imgCount} صور${hasVid}</span>
                            </div>
                            <div class="admin-actions">
                                <button class="btn-edit" onclick="editProduct(${p.id})">تعديل ✏️</button>
                                <button class="btn-danger" onclick="deleteProduct(${p.id})">حذف 🗑️</button>
                            </div>
                        </div>
                        <div class="social-share-box">
                            <a href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" class="social-btn s-wa">واتساب 📱</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=&quote=${shareText}" target="_blank" class="social-btn s-fb">فيسبوك 📘</a>
                            <a href="https://t.me/share/url?url=&text=${shareText}" target="_blank" class="social-btn s-tg">تيليجرام ✈️</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // دالة ضغط الصور لتقليل الحجم وجعل المتجر صاروخ
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 800;
                        
                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        async function processAndSaveProduct() {
            let id = document.getElementById('editingId').value;
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value);
            let category = document.getElementById('pCategory').value;
            let desc = document.getElementById('pDesc').value.trim();

            if (!name || isNaN(price)) {
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح.');
                return;
            }

            document.getElementById('loadingOverlay').style.display = 'flex';

            let imageFiles = document.getElementById('pImageFiles').files;
            let videoFile = document.getElementById('pVideoFile').files[0];

            let newImages = [...temporaryMediaCache.images];
            let newVideo = temporaryMediaCache.video;

            // معالجة الصور (بحد أقصى 10 صور)
            if (imageFiles.length > 0) {
                newImages = [];
                let limit = Math.min(imageFiles.length, 10);
                for (let i = 0; i < limit; i++) {
                    let compressedDataUrl = await compressImage(imageFiles[i]);
                    newImages.push({ type: 'image', src: compressedDataUrl });
                }
            }

            // معالجة الفيديو (فيديو واحد)
            if (videoFile) {
                let reader = new FileReader();
                await new Promise((resolve) => {
                    reader.onload = (e) => {
                        newVideo = { type: 'video', src: e.target.result };
                        resolve();
                    };
                    reader.readAsDataURL(videoFile);
                });
            }

            document.getElementById('loadingOverlay').style.display = 'none';

            let products = getProducts();

            if (id) {
                let p = products.find(item => item.id == id);
                if (p) {
                    p.name = name;
                    p.price = price;
                    p.category = category;
                    p.desc = desc;
                    if (imageFiles.length > 0) p.images = newImages;
                    if (videoFile) p.video = newVideo;
                }
                alert('✅ تم تحديث المنتج بنجاح!');
                cancelEdit();
            } else {
                products.unshift({
                    id: Date.now(),
                    name, price, category, desc,
                    images: newImages,
                    video: newVideo,
                    comments: []
                });
                alert('✅ تم نشر المنتج بنجاح!');
                clearForm();
            }
            
            saveProducts(products);
            loadAdminProducts();
        }

        function editProduct(id) {
            let products = getProducts();
            let p = products.find(item => item.id == id);
            
            if (p) {
                document.getElementById('editingId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pCategory').value = p.category || 'أدوات منزلية';
                document.getElementById('pDesc').value = p.desc || '';
                
                temporaryMediaCache.images = p.images || [];
                temporaryMediaCache.video = p.video || null;
                
                document.getElementById('formTitle').innerText = '✏️ تعديل المنتج';
                document.getElementById('saveBtn').innerText = 'حفظ التعديلات 💾';
                document.getElementById('cancelBtn').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function cancelEdit() {
            document.getElementById('editingId').value = '';
            clearForm();
            temporaryMediaCache = { images: [], video: null };
            document.getElementById('formTitle').innerText = '➕ إضافة منتج جديد';
            document.getElementById('saveBtn').innerText = 'نشر المنتج الآن 🚀';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function clearForm() {
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImageFiles').value = '';
            document.getElementById('pVideoFile').value = '';
            document.getElementById('pDesc').value = '';
        }

        function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;
            let products = getProducts().filter(p => p.id !== id);
            saveProducts(products);
            loadAdminProducts();
        }
    </script>
</body>
</html>
