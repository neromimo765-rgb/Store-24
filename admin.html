<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-24 | لوحة التحكم المحمية</title>
    <style>
        :root {
            --bg-primary: #0B0B10;
            --bg-card: #151522;
            --accent-gold: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #EF4444;
            --success: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 12px; padding-bottom: 70px; }
        .container { max-width: 480px; margin: 0 auto; }
        
        /* شاشة تسجيل الدخول */
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-primary); display: flex; justify-content: center; align-items: center; z-index: 3000; padding: 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .auth-card h2 { color: var(--accent-gold); font-size: 16px; margin-bottom: 12px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .header h1 { color: var(--accent-gold); font-size: 18px; }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; margin-bottom: 4px; color: var(--text-muted); font-weight: bold; }
        .form-control { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 8px; font-size: 11px; outline: none; }
        .form-control:focus { border-color: var(--accent-gold); }
        
        .btn { width: 100%; background: var(--accent-gold); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 5px; }
        .btn-danger { background: var(--danger); color: #fff; }

        .product-list-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .actions-btns { display: flex; gap: 4px; }
        .action-btn { background: var(--border-color); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .action-btn.del { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; color: var(--accent-gold); font-size: 13px; font-weight: bold; }
        .spinner { width: 35px; height: 35px; border: 4px solid var(--border-color); border-top: 4px solid var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- شاشة كلمة المرور -->
    <div id="authScreen">
        <div class="auth-card">
            <h2>🔒 لوحة التحكم محمية</h2>
            <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px;">الرجاء إدخال كلمة المرور للمتابعة</p>
            <input type="password" id="adminPasswordInput" class="form-control" placeholder="اكتب كلمة المرور..." style="margin-bottom: 10px; text-align: center;">
            <button class="btn" onclick="checkPassword()">دخول 🚀</button>
            <p id="authErrorMsg" style="color: var(--danger); font-size: 10px; margin-top: 8px; display: none;">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <span id="loadingText">جاري المعالجة والرفع...</span>
    </div>

    <div class="container">
        <div class="header">
            <h1>⚙️ لوحة تحكم Store-24</h1>
            <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-size:10px; color:var(--success);">متصل 🟢</span>
                <button onclick="logoutAdmin()" style="background:var(--danger); color:#fff; border:none; padding:3px 6px; border-radius:4px; font-size:9px; cursor:pointer;">قفل</button>
            </div>
        </div>

        <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; margin-bottom: 15px;">
            <h3 id="formTitle" style="color:var(--accent-gold); font-size:13px; margin-bottom:10px;">إضافة منتج جديد</h3>
            <input type="hidden" id="editProductId">
            
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="pName" class="form-control" placeholder="اكتب اسم المنتج...">
            </div>

            <div style="display: flex; gap: 8px;">
                <div class="form-group" style="flex: 1;">
                    <label>السعر (ج.م)</label>
                    <input type="number" id="pPrice" class="form-control" placeholder="السعر...">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>الخصم (اختياري - مثلاً: 20% أو 50 ج)</label>
                    <input type="text" id="pDiscount" class="form-control" placeholder="مثال: خصم 20%">
                </div>
            </div>

            <div class="form-group">
                <label>القسم</label>
                <select id="pCategory" class="form-control">
                    <option value="أدوات منزلية">🚿 أدوات منزلية</option>
                    <option value="إلكترونيات">⚡ إلكترونيات</option>
                    <option value="ملابس">👕 ملابس</option>
                    <option value="مستلزمات حيوانات أليفة">🐾 حيوانات</option>
                    <option value="الصحة والجمال">💄 جمال</option>
                    <option value="أجهزة كمبيوتر">💻 كمبيوتر</option>
                    <option value="عروض خاصة">🔥 عروض</option>
                </select>
            </div>

            <div class="form-group">
                <label>رفع صورة أو فيديو</label>
                <input type="file" id="mediaFile" class="form-control" accept="image/*,video/*">
            </div>

            <div class="form-group">
                <label>وصف المنتج</label>
                <textarea id="pDesc" class="form-control" rows="2" placeholder="اكتب تفاصيل المنتج..."></textarea>
            </div>

            <button class="btn" onclick="saveProduct()">حفظ ونشر المنتج 🚀</button>
            <button id="cancelEditBtn" class="btn btn-danger" style="display:none; margin-top:5px;" onclick="resetForm()">إلغاء التعديل</button>
        </div>

        <h3 style="font-size: 13px; margin-bottom: 8px; color: var(--text-muted);">المنتجات المضافة حالياً (<span id="productsCount">0</span>)</h3>
        <div id="adminProductsList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = {};
        const correctPassword = "qweasdzxc12ASD";

        window.checkPassword = function() {
            const inputVal = document.getElementById('adminPasswordInput').value;
            if (inputVal === correctPassword) {
                sessionStorage.setItem('store24_auth', 'true');
                document.getElementById('authScreen').style.display = 'none';
                initAdminPanel();
            } else {
                const errEl = document.getElementById('authErrorMsg');
                errEl.style.display = 'block';
                setTimeout(() => { errEl.style.display = 'none'; }, 2500);
            }
        }

        window.logoutAdmin = function() {
            sessionStorage.removeItem('store24_auth');
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => {
            // التحقق إذا كان مسجل دخول مسبقاً في الجلسة الحالية
            if (sessionStorage.getItem('store24_auth') === 'true') {
                document.getElementById('authScreen').style.display = 'none';
                initAdminPanel();
            }
        });

        function initAdminPanel() {
            const productsRef = ref(db, 'products');
            onValue(productsRef, (snapshot) => {
                const data = snapshot.val();
                allProducts = data || {};
                renderAdminList();
            });
        }

        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        window.saveProduct = function() {
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('pName').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value);
            const discount = document.getElementById('pDiscount').value.trim();
            const category = document.getElementById('pCategory').value;
            const desc = document.getElementById('pDesc').value.trim();
            const fileInput = document.getElementById('mediaFile');

            if (!name || isNaN(price)) {
                alert('الرجاء إدخال اسم المنتج والسعر على الأقل.');
                return;
            }

            showLoading('جاري معالجة البيانات...');

            const processSave = (mediaUrl, mediaType) => {
                const productId = id ? id : push(ref(db, 'products')).key;
                const existingComments = (id && allProducts[id] && allProducts[id].comments) ? allProducts[id].comments : [];
                
                let finalImages = allProducts[id] && allProducts[id].images ? allProducts[id].images : [];
                if (mediaUrl) {
                    finalImages = [{ src: mediaUrl, type: mediaType }];
                }

                const productData = {
                    id: productId,
                    name,
                    price,
                    discount,
                    category,
                    desc,
                    images: finalImages,
                    comments: existingComments
                };

                set(ref(db, 'products/' + productId), productData)
                    .then(() => {
                        hideLoading();
                        resetForm();
                        alert('تم حفظ ونشر المنتج بنجاح! 🎉');
                    })
                    .catch((error) => {
                        hideLoading();
                        alert('حدث خطأ أثناء الحفظ: ' + error.message);
                    });
            };

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                
                showLoading('جاري ضغط وتحويل الوسائط...');
                reader.onload = function(e) {
                    const base64String = e.target.result;
                    const mediaType = file.type.startsWith('video') ? 'video' : 'image';
                    processSave(base64String, mediaType);
                };
                reader.readAsDataURL(file);
            } else {
                processSave(null, null);
            }
        };

        function renderAdminList() {
            const listEl = document.getElementById('adminProductsList');
            const keys = Object.keys(allProducts);
            document.getElementById('productsCount').innerText = keys.length;

            if (keys.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:15px;">لا توجد منتجات مسجلة حالياً.</div>`;
                return;
            }

            listEl.innerHTML = keys.map(key => {
                const p = allProducts[key];
                return `
                    <div class="product-list-item">
                        <div>
                            <strong>${p.name}</strong><br>
                            <span style="color:var(--accent-gold);">${p.price} ج.م</span> 
                            ${p.discount ? `<span style="color:var(--success); background:rgba(16,185,129,0.1); padding:1px 4px; border-radius:4px; font-size:9px;">🏷️ ${p.discount}</span>` : ''}
                        </div>
                        <div class="actions-btns">
                            <button class="action-btn" onclick="editProduct('${key}')">تعديل</button>
                            <button class="action-btn del" onclick="deleteProduct('${key}')">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.editProduct = function(key) {
            const p = allProducts[key];
            document.getElementById('editProductId').value = key;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pDiscount').value = p.discount || '';
            document.getElementById('pCategory').value = p.category;
            document.getElementById('pDesc').value = p.desc || '';
            
            document.getElementById('formTitle').innerText = "تعديل المنتج: " + p.name;
            document.getElementById('cancelEditBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetForm = function() {
            document.getElementById('editProductId').value;
            document.getElementById('editProductId').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDiscount').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('mediaFile').value = '';
            document.getElementById('formTitle').innerText = "إضافة منتج جديد";
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        window.deleteProduct = function(key) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) {
                remove(ref(db, 'products/' + key)).then(() => {
                    alert('تم الحذف بنجاح.');
                });
            }
        }
    </script>
</body>
</html>
