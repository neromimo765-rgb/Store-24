<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة صفحة الهبوط</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #181824;
            --accent-gold: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
            --info: #3B82F6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; padding: 16px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        header h1 { font-size: 17px; color: var(--accent-gold); font-weight: 800; }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .card h2 { font-size: 14px; color: var(--accent-gold); margin-bottom: 12px; font-weight: bold; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; }
        .form-control {
            width: 100%; background: #0f0f13; border: 1px solid var(--border-color);
            color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; outline: none;
        }
        .form-control:focus { border-color: var(--accent-gold); }

        .btn {
            width: 100%; background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #000; border: none; padding: 12px; border-radius: 8px;
            font-weight: 900; font-size: 13px; cursor: pointer; margin-top: 5px;
        }
        .btn-cancel { background: var(--text-muted); color: #000; display: none; }

        .landing-item {
            background: #0f0f13;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .landing-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #fff; }
        .landing-info { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
        
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .action-btn {
            padding: 8px 4px; border-radius: 6px; font-size: 10px; font-weight: bold;
            border: none; cursor: pointer; text-align: center; color: #fff;
        }
        .btn-edit { background: var(--info); }
        .btn-copy { background: #6366F1; }
        .btn-preview { background: var(--accent-gold); color: #000; }
        .btn-delete { background: var(--accent-red); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛠️ لوحة تحكم صفحة الهبوط</h1>
            <span id="totalOrdersCount" style="font-size: 11px; background: var(--bg-card); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color);">الطلبات: 0</span>
        </header>

        <!-- نموذج إدارة صفحة الهبوط (إضافة وتعديل كامل) -->
        <div class="card">
            <h2 id="formTitle">➕ إنشاء صفحة هبوط جديدة</h2>
            <input type="hidden" id="editingLandingId" value="">
            
            <div class="form-group">
                <label>عنوان العرض الرئيسي في الصفحة:</label>
                <input type="text" id="title" class="form-control" placeholder="مثال: عرض بكج أجهزة منزلية...">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                    <label>السعر الحالي:</label>
                    <input type="number" id="price" class="form-control" placeholder="250">
                </div>
                <div class="form-group">
                    <label>السعر القديم (مشطوب):</label>
                    <input type="number" id="oldPrice" class="form-control" placeholder="350">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                    <label>العملة:</label>
                    <select id="currency" class="form-control">
                        <option value="SAR">ريال سعودي (SAR)</option>
                        <option value="EGP">جنيه مصري (EGP)</option>
                        <option value="USD">دولار أمريكي (USD)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>وقت العداد (ساعات:دقائق:ثواني):</label>
                    <input type="text" id="timer" class="form-control" value="02:45:00" placeholder="02:45:00">
                </div>
            </div>

            <div class="form-group">
                <label>رابط الصورة المباشر:</label>
                <input type="text" id="imageUrl" class="form-control" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>رابط الفيديو المباشر (اختياري):</label>
                <input type="text" id="videoUrl" class="form-control" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>تفاصيل ومميزات العرض (تقسيمها بأسطر):</label>
                <textarea id="desc" class="form-control" rows="4" placeholder="اكتب تفاصيل ومميزات المنتج..."></textarea>
            </div>

            <button onclick="saveOrUpdateLanding()" id="submitBtn" class="btn">حفظ وإنشاء صفحة الهبوط 🚀</button>
            <button onclick="resetForm()" id="cancelBtn" class="btn btn-cancel" style="margin-top: 5px;">إلغاء التعديل</button>
        </div>

        <!-- قائمة صفحات الهبوط المتاحة -->
        <div class="card">
            <h2>📦 صفحات الهبوط الحالية</h2>
            <div id="landingsList">
                <p style="text-align: center; color: var(--text-muted); font-size: 12px;">جاري التحميل...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        async function loadStats() {
            try {
                const snap = await get(ref(db, 'analytics/orders'));
                if (snap.exists()) {
                    document.getElementById('totalOrdersCount').innerText = `الطلبات: ${snap.val()}`;
                }
            } catch (e) { console.error(e); }
        }

        async function loadLandings() {
            try {
                const snap = await get(ref(db, 'landings'));
                const container = document.getElementById('landingsList');
                
                if (!snap.exists()) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 12px;">لا توجد صفحات هبوط مضافة.</p>`;
                    return;
                }

                let html = '';
                const landings = snap.val();
                
                for (let id in landings) {
                    const l = landings[id];
                    const landingJson = encodeURIComponent(JSON.stringify({ id, ...l }));
                    
                    html += `
                        <div class="landing-item">
                            <div class="landing-title">${l.title || 'بدون عنوان'}</div>
                            <div class="landing-info">السعر: ${l.price || 0} ${l.currency || 'SAR'}</div>
                            <div class="actions-grid">
                                <button onclick="prepareEdit('${landingJson}')" class="action-btn btn-edit">تعديل</button>
                                <button onclick="copyLink('${id}')" class="action-btn btn-copy">نسخ</button>
                                <button onclick="previewLanding('${id}')" class="action-btn btn-preview">معاينة</button>
                                <button onclick="deleteLanding('${id}')" class="action-btn btn-delete">حذف</button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (err) { console.error(err); }
        }

        window.saveOrUpdateLanding = async function() {
            const editingId = document.getElementById('editingLandingId').value;
            const title = document.getElementById('title').value.trim();
            const price = document.getElementById('price').value.trim();
            const oldPrice = document.getElementById('oldPrice').value.trim();
            const currency = document.getElementById('currency').value;
            const timer = document.getElementById('timer').value.trim() || "02:45:00";
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const desc = document.getElementById('desc').value.trim();

            if (!title || !price) {
                alert('الرجاء كتابة العنوان والسعر الحالي.');
                return;
            }

            const landingData = { title, price, oldPrice, currency, timer, imageUrl, videoUrl, desc };

            try {
                if (editingId) {
                    await update(ref(db, 'landings/' + editingId), landingData);
                    alert('تم تحديث صفحة الهبوط بنجاح!');
                } else {
                    await push(ref(db, 'landings'), { ...landingData, createdAt: Date.now() });
                    alert('تم إنشاء صفحة الهبوط بنجاح!');
                }
                resetForm();
                loadLandings();
            } catch (e) {
                alert('حدث خطأ، يرجى المحاولة مرة أخرى.');
            }
        }

        window.prepareEdit = function(encodedData) {
            const data = JSON.parse(decodeURIComponent(encodedData));
            
            document.getElementById('editingLandingId').value = data.id;
            document.getElementById('title').value = data.title || '';
            document.getElementById('price').value = data.price || '';
            document.getElementById('oldPrice').value = data.oldPrice || '';
            document.getElementById('currency').value = data.currency || 'SAR';
            document.getElementById('timer').value = data.timer || '02:45:00';
            document.getElementById('imageUrl').value = data.imageUrl || '';
            document.getElementById('videoUrl').value = data.videoUrl || '';
            document.getElementById('desc').value = data.desc || '';

            document.getElementById('formTitle').innerText = '✏️ تعديل صفحة الهبوط';
            document.getElementById('submitBtn').innerText = 'تحديث صفحة الهبوط 🔄';
            document.getElementById('cancelBtn').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetForm = function() {
            document.getElementById('editingLandingId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('price').value = '';
            document.getElementById('oldPrice').value = '';
            document.getElementById('timer').value = '02:45:00';
            document.getElementById('imageUrl').value = '';
            document.getElementById('videoUrl').value = '';
            document.getElementById('desc').value = '';

            document.getElementById('formTitle').innerText = '➕ إنشاء صفحة هبوط جديدة';
            document.getElementById('submitBtn').innerText = 'حفظ وإنشاء صفحة الهبوط 🚀';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        window.copyLink = function(id) {
            const link = window.location.origin + window.location.pathname.replace('index.html', '') + 'landing.html?id=' + id;
            navigator.clipboard.writeText(link);
            alert('تم نسخ رابط صفحة الهبوط بنجاح!');
        }

        window.previewLanding = function(id) {
            window.open('landing.html?id=' + id, '_blank');
        }

        window.deleteLanding = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذه الصفحة نهائياً؟')) {
                await remove(ref(db, 'landings/' + id));
                loadLandings();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadLandings();
        });
    </script>
</body>
</html>
