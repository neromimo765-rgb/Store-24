<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-24 | لوحة تحكم المالك</title>
    <style>
        :root {
            --bg-primary: #0B0B10;
            --bg-card: #151522;
            --accent-gold: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #EF4444;
            --success: #10B981;
            --wa-color: #25D366;
            --fb-color: #1877F2;
            --tg-color: #0088CC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 15px; padding-bottom: 60px; }

        .container { max-width: 480px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .header h2 { color: var(--accent-gold); font-size: 16px; }
        .back-store-btn { background: var(--bg-card); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 15px; }
        .card h3 { font-size: 13px; color: var(--accent-gold); margin-bottom: 10px; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
        .form-control { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: #fff; padding: 9px; border-radius: 8px; font-size: 11px; outline: none; }
        .form-control:focus { border-color: var(--accent-gold); }

        .btn-primary { width: 100%; background: var(--accent-gold); color: #000; border: none; padding: 11px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 8px; }
        .btn-cancel { width: 100%; background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 7px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; margin-top: 5px; display: none; }

        .products-list { display: flex; flex-direction: column; gap: 10px; }
        .admin-product-item { background: var(--bg-primary); padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        
        .admin-product-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .admin-product-info h4 { font-size: 12px; color: #fff; margin-bottom: 2px; }
        .admin-product-info span { font-size: 10px; color: var(--accent-gold); font-weight: bold; }
        
        .admin-actions { display: flex; gap: 5px; }
        .btn-edit { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); padding: 4px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 4px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: bold; }

        /* أزرار مواقع التواصل الاجتماعي تحت كل منتج في لوحة التحكم */
        .social-share-box { display: flex; gap: 4px; border-top: 1px solid var(--border-color); padding-top: 8px; }
        .social-btn { flex: 1; font-size: 9px; padding: 5px 2px; border-radius: 6px; text-align: center; text-decoration: none; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; gap: 2px; }
        .s-wa { background: rgba(37, 211, 102, 0.2); border: 1px solid var(--wa-color); color: var(--wa-color); }
        .s-fb { background: rgba(24, 119, 242, 0.2); border: 1px solid var(--fb-color); color: var(--fb-color); }
        .s-tg { background: rgba(0, 136, 204, 0.2); border: 1px solid var(--tg-color); color: var(--tg-color); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>⚙️ لوحة تحكم المالك</h2>
            <a href="index.html" class="back-store-btn" target="_blank">عرض المتجر 🛒</a>
        </div>

        <!-- نموذج إضافة أو تعديل منتج -->
        <div class="card">
            <h3 id="formTitle">➕ إضافة منتج جديد</h3>
            <input type="hidden" id="editingId" value="">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="pName" class="form-control" placeholder="مثال: ساعة ذكية أصلية">
            </div>
            <div class="form-group">
                <label>السعر (بالجنيه):</label>
                <input type="number" id="pPrice" class="form-control" placeholder="مثال: 750">
            </div>
            <div class="form-group">
                <label>اختر القسم:</label>
                <select id="pCategory" class="form-control">
                    <option value="أدوات منزلية">🚿 أدوات منزلية</option>
                    <option value="إلكترونيات">⚡ إلكترونيات</option>
                    <option value="ملابس">👕 ملابس</option>
                    <option value="مستلزمات حيوانات أليفة">🐾 مستلزمات حيوانات أليفة</option>
                    <option value="الصحة والجمال">💄 الصحة والجمال</option>
                    <option value="أجهزة كمبيوتر">💻 أجهزة كمبيوتر</option>
                    <option value="عروض خاصة">🔥 عروض خاصة</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط الصورة أو الفيديو المباشر (.jpg أو .mp4):</label>
                <input type="text" id="pImage" class="form-control" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>وصف المنتج:</label>
                <textarea id="pDesc" class="form-control" rows="2" placeholder="تفاصيل ومميزات المنتج..."></textarea>
            </div>
            <button class="btn-primary" id="saveBtn" onclick="saveProduct()">نشر المنتج الآن 🚀</button>
            <button class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">إلغاء التعديل ✕</button>
        </div>

        <!-- قائمة المنتجات الحالية للإدارة والتعديل والمشاركة -->
        <div class="card">
            <h3>📦 إدارة المنتجات الحالية (<span id="totalAdminCount">0</span>)</h3>
            <div class="products-list" id="adminProductsList"></div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadAdminProducts();
        });

        function loadAdminProducts() {
            let data = localStorage.getItem('store_products');
            let products = data ? JSON.parse(data) : [];
            
            document.getElementById('totalAdminCount').innerText = products.length;
            let container = document.getElementById('adminProductsList');

            if (products.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 11px; padding: 15px;">لا توجد منتجات مضافة حالياً.</p>`;
                return;
            }

            container.innerHTML = products.map(p => {
                let shareText = encodeURIComponent(`🔥 لا يفوتك هذا العرض المميز: *${p.name}* \n💰 السعر: ${p.price} ج.م\n📂 القسم: ${p.category || 'عام'}\n📝 التفاصيل: ${p.desc || 'منتج عالي الجودة'}`);
                
                return `
                    <div class="admin-product-item">
                        <div class="admin-product-header">
                            <div class="admin-product-info">
                                <h4>${p.name}</h4>
                                <span>${p.price} ج.م | <em style="color:#aaa;">${p.category || 'عام'}</em></span>
                            </div>
                            <div class="admin-actions">
                                <button class="btn-edit" onclick="editProduct(${p.id})">تعديل ✏️</button>
                                <button class="btn-danger" onclick="deleteProduct(${p.id})">حذف 🗑️</button>
                            </div>
                        </div>
                        
                        <!-- أزرار مواقع التواصل الاجتماعي تحت كل منتج للنشر المباشر -->
                        <div class="social-share-box">
                            <a href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" class="social-btn s-wa">واتساب 📱</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=&quote=${shareText}" target="_blank" class="social-btn s-fb">فيسبوك 📘</a>
                            <a href="https://t.me/share/url?url=&text=${shareText}" target="_blank" class="social-btn s-tg">تيليجرام ✈️</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function saveProduct() {
            let id = document.getElementById('editingId').value;
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value);
            let category = document.getElementById('pCategory').value;
            let mediaUrl = document.getElementById('pImage').value.trim();
            let desc = document.getElementById('pDesc').value.trim();

            if (!name || isNaN(price)) {
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح.');
                return;
            }

            let images = [];
            if (mediaUrl) {
                let isVideo = mediaUrl.endsWith('.mp4') || mediaUrl.includes('video') || mediaUrl.includes('.webm');
                images.push({ type: isVideo ? 'video' : 'image', src: mediaUrl });
            }

            let data = localStorage.getItem('store_products');
            let products = data ? JSON.parse(data) : [];

            if (id) {
                // تعديل المنتج الموجود
                let index = products.findIndex(p => p.id == id);
                if (index !== -1) {
                    products[index].name = name;
                    products[index].price = price;
                    products[index].category = category;
                    products[index].desc = desc;
                    if (mediaUrl) products[index].images = images;
                }
                alert('✅ تم تعديل وتحديث المنتج بنجاح تام!');
                cancelEdit();
            } else {
                // إضافة منتج جديد
                let newProduct = {
                    id: Date.now(),
                    name: name,
                    price: price,
                    category: category,
                    desc: desc,
                    images: images,
                    comments: []
                };
                products.unshift(newProduct);
                alert('✅ تم نشر المنتج الجديد بنجاح!');
                clearForm();
            }
            
            localStorage.setItem('store_products', JSON.stringify(products));
            loadAdminProducts();
        }

        function editProduct(id) {
            let data = localStorage.getItem('store_products');
            if (!data) return;
            let products = JSON.parse(data);
            let p = products.find(item => item.id == id);
            
            if (p) {
                document.getElementById('editingId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pCategory').value = p.category || 'أدوات منزلية';
                document.getElementById('pDesc').value = p.desc || '';
                if (p.images && p.images.length > 0) {
                    document.getElementById('pImage').value = p.images[0].src;
                } else {
                    document.getElementById('pImage').value = '';
                }
                
                document.getElementById('formTitle').innerText = '✏️ تعديل المنتج الحالي';
                document.getElementById('saveBtn').innerText = 'حفظ التعديلات والتحديث 💾';
                document.getElementById('cancelBtn').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function cancelEdit() {
            document.getElementById('editingId').value = '';
            clearForm();
            document.getElementById('formTitle').innerText = '➕ إضافة منتج جديد';
            document.getElementById('saveBtn').innerText = 'نشر المنتج الآن 🚀';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function clearForm() {
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImage').value = '';
            document.getElementById('pDesc').value = '';
        }

        function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) return;

            let data = localStorage.getItem('store_products');
            if (!data) return;
            let products = JSON.parse(data);

            products = products.filter(p => p.id !== id);
            localStorage.setItem('store_products', JSON.stringify(products));

            loadAdminProducts();
        }
    </script>
</body>
</html>
