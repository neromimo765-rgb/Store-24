<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-24 | لوحة تحكم المالك</title>
    <style>
        :root {
            --bg-primary: #0B0B10;
            --bg-card: #151522;
            --accent-gold: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #EF4444;
            --success: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 15px; padding-bottom: 50px; }

        .container { max-width: 480px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .header h2 { color: var(--accent-gold); font-size: 16px; }
        .back-store-btn { background: var(--bg-card); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 15px; }
        .card h3 { font-size: 13px; color: var(--accent-gold); margin-bottom: 10px; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
        .form-control { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: #fff; padding: 9px; border-radius: 8px; font-size: 11px; outline: none; }
        .form-control:focus { border-color: var(--accent-gold); }

        .btn-primary { width: 100%; background: var(--accent-gold); color: #000; border: none; padding: 11px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 8px; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: none; padding: 4px 8px; border-radius: 6px; font-size: 9px; cursor: pointer; font-weight: bold; }

        .products-list { display: flex; flex-direction: column; gap: 8px; }
        .admin-product-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-primary); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); }
        .admin-product-info h4 { font-size: 11px; color: #fff; margin-bottom: 2px; }
        .admin-product-info span { font-size: 9px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>⚙️ لوحة تحكم المالك</h2>
            <a href="index.html" class="back-store-btn">عرض المتجر 🛒</a>
        </div>

        <!-- نموذج إضافة منتج جديد -->
        <div class="card">
            <h3>➕ إضافة منتج جديد وتحديد القسم</h3>
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="pName" class="form-control" placeholder="مثال: مطحنة ومساحة">
            </div>
            <div class="form-group">
                <label>السعر (بالجنيه):</label>
                <input type="number" id="pPrice" class="form-control" placeholder="مثال: 650">
            </div>
            <div class="form-group">
                <label>اختر القسم (الكتالوج):</label>
                <select id="pCategory" class="form-control">
                    <option value="أدوات منزلية">🚿 أدوات منزلية</option>
                    <option value="إلكترونيات">⚡ إلكترونيات</option>
                    <option value="عروض خاصة">🔥 عروض خاصة</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط الصورة أو الفيديو المباشر:</label>
                <input type="text" id="pImage" class="form-control" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>وصف المنتج:</label>
                <textarea id="pDesc" class="form-control" rows="2" placeholder="تفاصيل المنتج ومميزاته..."></textarea>
            </div>
            <button class="btn-primary" onclick="addNewProduct()">نشر المنتج الآن في الكتالوج 🚀</button>
        </div>

        <!-- قائمة المنتجات الحالية -->
        <div class="card">
            <h3>📦 إدارة المنتجات (<span id="totalAdminCount">0</span>)</h3>
            <div class="products-list" id="adminProductsList"></div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadAdminProducts();
        });

        function loadAdminProducts() {
            let data = localStorage.getItem('store_products');
            let products = data ? JSON.parse(data) : [];
            
            document.getElementById('totalAdminCount').innerText = products.length;
            let container = document.getElementById('adminProductsList');

            if (products.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 11px;">لا توجد منتجات مضافة حالياً.</p>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="admin-product-item">
                    <div class="admin-product-info">
                        <h4>${p.name}</h4>
                        <span>${p.price} ج.م | القسم: ${p.category || 'عام'}</span>
                    </div>
                    <button class="btn-danger" onclick="deleteProduct(${p.id})">حذف 🗑️</button>
                </div>
            `).join('');
        }

        function addNewProduct() {
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value);
            let category = document.getElementById('pCategory').value;
            let imageUrl = document.getElementById('pImage').value.trim();
            let desc = document.getElementById('pDesc').value.trim();

            if (!name || isNaN(price)) {
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح.');
                return;
            }

            let images = [];
            if (imageUrl) {
                let isVideo = imageUrl.endsWith('.mp4') || imageUrl.includes('video');
                images.push({ type: isVideo ? 'video' : 'image', src: imageUrl });
            }

            let data = localStorage.getItem('store_products');
            let products = data ? JSON.parse(data) : [];

            let newProduct = {
                id: Date.now(),
                name: name,
                price: price,
                category: category,
                desc: desc,
                images: images
            };

            products.unshift(newProduct);
            
            try {
                localStorage.setItem('store_products', JSON.stringify(products));
                
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImage').value = '';
                document.getElementById('pDesc').value = '';

                loadAdminProducts();
                alert('✅ تم نشر المنتج وتحديد القسم بنجاح!');
            } catch (e) {
                alert('⚠️ حدث خطأ في الذاكرة.');
            }
        }

        function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

            let data = localStorage.getItem('store_products');
            if (!data) return;
            let products = JSON.parse(data);

            products = products.filter(p => p.id !== id);
            localStorage.setItem('store_products', JSON.stringify(products));

            loadAdminProducts();
        }
    </script>
</body>
</html>
