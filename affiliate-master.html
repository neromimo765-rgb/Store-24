<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المستشار العالمي للاستثمار والأفلييت الاحترافي 🌍🔥</title>
    <style>
        :root {
            --bg-primary: #09090e;
            --bg-card: #12121a;
            --accent-gold: #F59E0B;
            --accent-blue: #3B82F6;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.12);
            --success: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 12px; }
        .container { max-width: 100%; width: 100%; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        header { text-align: center; margin-bottom: 16px; }
        h1 { font-size: 16px; color: var(--accent-gold); font-weight: 900; margin-bottom: 4px; line-height: 1.4; }
        p.subtitle { font-size: 10px; color: var(--text-muted); line-height: 1.4; }

        .form-grid { display: flex; flex-direction: column; gap: 10px; }
        @media(min-width: 480px) {
            .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .form-group.full { grid-column: span 2; }
        }
        .form-group { margin-bottom: 10px; }
        .form-group.full { width: 100%; }
        
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: var(--text-main); }
        input, select {
            width: 100%; background: #0a0a0f; border: 1px solid var(--border-color); color: #fff;
            padding: 12px; border-radius: 10px; font-size: 14px; outline: none; appearance: none;
        }
        input:focus, select:focus { border-color: var(--accent-gold); }

        .btn-analyze {
            width: 100%; background: linear-gradient(135deg, var(--accent-gold), #D97706);
            color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 900;
            font-size: 13px; cursor: pointer; margin-top: 10px; text-align: center;
        }
        .btn-analyze:active { opacity: 0.8; transform: scale(0.98); }

        .result-box {
            margin-top: 16px; background: #0a0a0f; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 14px; display: none; font-size: 11px; line-height: 1.7;
        }
        .result-section { margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .result-section:last-child { border-bottom: none; }
        .result-title { font-weight: 900; color: var(--accent-gold); margin-bottom: 6px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        
        .loading { text-align: center; color: var(--accent-gold); font-weight: bold; padding: 20px; display: none; font-size: 11px; }
        
        .badge-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; margin-right: 4px; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .copy-box { background: #12121a; border: 1px dashed var(--accent-gold); padding: 10px; border-radius: 8px; margin-top: 6px; font-family: monospace; color: #fbbf24; white-space: pre-wrap; font-size: 10px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌍 المستشار العالمي للأفلييت الاحترافي</h1>
            <p class="subtitle">محرك الذكاء الاصطناعي الأقوى والأسرع للعمل المباشر عبر هاتف الأندرويد</p>
        </header>

        <div class="form-grid">
            <div class="form-group full">
                <label>🔗 اسم المنتج أو رابط الأفلييت:</label>
                <input type="text" id="productName" placeholder="مثال: ساعة ذكية / ماكينة قهوة...">
            </div>

            <div class="form-group">
                <label>💰 عمولتك للقطعة:</label>
                <input type="number" id="affiliateCommission" placeholder="مثال: 100">
            </div>
            
            <div class="form-group">
                <label>💵 سعر بيع المنتج:</label>
                <input type="number" id="productPrice" placeholder="مثال: 500">
            </div>

            <div class="form-group full">
                <label>💱 العملة المستخدمة:</label>
                <select id="currencyType">
                    <option value="جنيه مصري (EGP)">جنيه مصري (EGP)</option>
                    <option value="ريال سعودي (SAR)">ريال سعودي (SAR)</option>
                </select>
            </div>
        </div>

        <button class="btn-analyze" onclick="runGlobalAffiliateStrategy()">🚀 تشغيل التحليل الفوري</button>

        <div id="loadingDiv" class="loading">
            🔄 جاري معالجة الخوارزميات وحساب الأرباح بدقة...
        </div>

        <div id="resultBox" class="result-box">
            <!-- النتائج هنا -->
        </div>
    </div>

    <script>
        function runGlobalAffiliateStrategy() {
            const name = document.getElementById('productName').value.trim();
            const commission = parseFloat(document.getElementById('affiliateCommission').value) || 0;
            const price = parseFloat(document.getElementById('productPrice').value) || 0;
            const currency = document.getElementById('currencyType').value;

            if (!name || commission === 0 || price === 0) {
                alert('الرجاء التأكد من إدخال اسم المنتج، العمولة، والسعر بشكل صحيح.');
                return;
            }

            const loadingDiv = document.getElementById('loadingDiv');
            const resultBox = document.getElementById('resultBox');

            loadingDiv.style.display = 'block';
            resultBox.style.display = 'none';

            setTimeout(() => {
                loadingDiv.style.display = 'none';
                resultBox.style.display = 'block';

                let maxCpa = commission * 0.45; 
                let isHighCommission = (commission / price) >= 0.15;
                let estimatedClicksFor10Sales = Math.round(10 / 0.025); 
                let netRealCommission = commission * 0.88; 
                let timeRoiScore = commission >= 75 ? 'ممتاز (جهد خفيف وعائد قوي)' : 'متوسط (يحتاج مبيعات أكثر)';

                resultBox.innerHTML = `
                    <div class="result-section">
                        <div class="result-title">📊 1. الصافي الواقعي والأرباح</div>
                        <p>العمولة الصافية (بعد خصم 12% مرتجعات): <b style="color: var(--success);">${netRealCommission.toFixed(1)} ${currency}</b></p>
                        <p>الحد الأقصى للإعلان الآمن: <b style="color: var(--accent-gold);">${maxCpa.toFixed(1)} ${currency}</b></p>
                        <p>${isHighCommission ? '<span class="badge-tag badge-success">مربح جداً</span>' : '<span class="badge-tag badge-danger">عضوي فقط (بدون إعلانات)</span>'}</p>
                    </div>

                    <div class="result-section">
                        <div class="result-title">⏳ 2. الترافيك المطلوب</div>
                        <p>لتحقيق <b>10 مبيعات</b> تحتاج تقريباً إلى <b>${estimatedClicksFor10Sales} زائر حقيقي</b> ضاغط على الرابط.</p>
                        <p>تقييم العائد على الوقت: <b style="color: var(--accent-gold);">${timeRoiScore}</b></p>
                    </div>

                    <div class="result-section">
                        <div class="result-title">🛡️ 3. حماية الروابط وتجنب الحظر</div>
                        <p>• تجنب وضع رابط الأفلييت المباشر بالتعليقات العامة لحسابك.</p>
                        <p>• استخدم صفحة وسيطة أو نظام الرد التلقائي على كلمة (مهتم).</p>
                    </div>

                    <div class="result-section">
                        <div class="result-title">📢 4. سكريبت تيك توك / ريلز جاهز للنسخ</div>
                        <div class="copy-box">لو بتدور على (${name}) الأصلي وبتخاف تتنصب عليك.. اسمع الكلمتين دول للاخر!
المنتج ده جربته بنفسي ولقيت فيه المواصفات الحقيقية، ودبرت لكم رابط التوكيل الموثوق عليه خصم.
رابط الطلب سيبهولكم في أول كومنت أو في البايو!</div>
                    </div>

                    <div class="result-section">
                        <div class="result-title">🛑 5. طوارئ وخطة العمل</div>
                        <p>• <b>الانسحاب (Kill-Switch):</b> لو دخل 150 زائر ومافيش ولا مبيعة، غير المنتج فوراً.</p>
                        <p>• <b>التوسع (Scaling):</b> لو جت أول 3 مبيعات بسهولة، اعمل 3 فيديوهات كمان بنفس الفكرة لمضاعفة أرباحك.</p>
                    </div>
                `;

                // التمرير التلقائي للنتيجة على الموبايل
                resultBox.scrollIntoView({ behavior: 'smooth' });
            }, 800);
        }
    </script>
</body>
</html>
