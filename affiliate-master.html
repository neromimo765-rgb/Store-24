<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المستشار الشامل للدروبشيبينغ والتسويق الذكي 🌍🔥</title>
    <style>
        :root {
            --bg-primary: #09090e;
            --bg-card: #12121a;
            --accent-gold: #F59E0B;
            --accent-blue: #3B82F6;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.12);
            --success: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 12px; }
        .container { max-width: 100%; width: 100%; margin: 0 auto; }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        header { text-align: center; margin-bottom: 16px; }
        h1 { font-size: 16px; color: var(--accent-gold); font-weight: 900; margin-bottom: 4px; line-height: 1.4; }
        p.subtitle { font-size: 10px; color: var(--text-muted); line-height: 1.4; }

        .form-grid { display: flex; flex-direction: column; gap: 10px; }
        @media(min-width: 480px) {
            .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .form-group.full { grid-column: span 2; }
        }
        .form-group { margin-bottom: 10px; }
        .form-group.full { width: 100%; }
        
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: var(--text-main); }
        input, select, textarea {
            width: 100%; background: #0a0a0f; border: 1px solid var(--border-color); color: #fff;
            padding: 12px; border-radius: 10px; font-size: 14px; outline: none; appearance: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-gold); }

        button {
            background: linear-gradient(135deg, var(--accent-gold), #D97706);
            color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 900;
            font-size: 13px; cursor: pointer; width: 100%; text-align: center; margin-top: 10px;
        }
        button:active { opacity: 0.8; transform: scale(0.98); }

        .btn-reset { background: #374151; color: #fff; margin-top: 8px; }

        .result-box {
            margin-top: 16px; background: #0a0a0f; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 14px; display: none; font-size: 11px; line-height: 1.7;
        }
        .result-section { margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .result-section:last-child { border-bottom: none; }
        .result-title { font-weight: 900; color: var(--accent-gold); margin-bottom: 6px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        
        .badge-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; margin-right: 4px; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .copy-box { background: #12121a; border: 1px dashed var(--accent-gold); padding: 10px; border-radius: 8px; margin-top: 6px; font-family: monospace; color: #fbbf24; white-space: pre-wrap; font-size: 10px; word-break: break-all; }
        
        .preview-img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; border: 1px solid var(--border-color); }
        h2 { font-size: 14px; color: var(--accent-gold); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- قسم رأس الصفحة -->
        <div class="card">
            <header>
                <h1>🌍 مساعد الدروبشيبينغ والتسويق الذكي</h1>
                <p class="subtitle">منظومتك الخاصة المجانية لإدارة الأرباح، تتبع الأوردرات، وخطط السوشيال ميديا بالكامل</p>
            </header>
        </div>

        <!-- القسم الأول: حاسبة الدروبشيبينغ وتحليل المنصات -->
        <div class="card">
            <h2>💰 1. حاسبة أرباح الدروبشيبينغ وخطة النشر</h2>
            <div class="form-grid">
                <div class="form-group full">
                    <label>🔗 اسم المنتج أو رابط الأفلييت / الجملة:</label>
                    <input type="text" id="productName" placeholder="مثال: منظم مطبخ ذكي...">
                </div>

                <div class="form-group full">
                    <label>📸 رفع صورة المنتج من التليفون (للمعاينة):</label>
                    <input type="file" id="productImageInput" accept="image/*" onchange="previewImage(event)">
                    <img id="imagePreview" class="preview-img" alt="معاينة المنتج">
                </div>

                <div class="form-group">
                    <label>📦 سعر الشراء من موقع الجملة:</label>
                    <input type="number" id="basePrice" placeholder="مثال: 150">
                </div>
                
                <div class="form-group">
                    <label>💵 سعر البيع المقترح للعميل بمتجرك:</label>
                    <input type="number" id="sellPrice" placeholder="مثال: 300">
                </div>

                <div class="form-group full">
                    <label>💱 العملة المستخدمة:</label>
                    <select id="currencyType">
                        <option value="جنيه مصري (EGP)">جنيه مصري (EGP)</option>
                        <option value="ريال سعودي (SAR)">ريال سعودي (SAR)</option>
                    </select>
                </div>
            </div>

            <button onclick="runAnalysis()">🚀 تشغيل التحليل الشامل وخطة السوشيال ميديا</button>
            <button class="btn-reset" onclick="resetFormForNextProduct()">🔄 تحليل منتج جديد (إدخال جديد)</button>

            <div id="analysisResult" class="result-box"></div>
        </div>

        <!-- القسم الثاني: مساعد "أنا واقف فين؟" -->
        <div class="card">
            <h2>🧭 2. مساعد "أنا واقف فين؟" (دليل المشاكل والحلول)</h2>
            <div class="form-group full">
                <label>اختر مشكلتك الحالية لتعرف خطوتك القادمة:</label>
                <select id="userProblem" onchange="getHelp()">
                    <option value="">-- اضغط لاختيار الموقف الحالي --</option>
                    <option value="1">نزلت المنتج على المتجر بس محدش شافه خالص</option>
                    <option value="2">جالي مشاهدات بس مفيش ولا أوردر دخل</option>
                    <option value="3">الناس بتسأل على السعر بس مش بيكملوا شراء</option>
                    <option value="4">معيش فلوس لإعلانات ممولة وعاوز أبيع مجاناً</option>
                </select>
            </div>
            <div id="helpResult" class="result-box"></div>
        </div>

        <!-- القسم الثالث: مسجل أوردرات العملاء -->
        <div class="card">
            <h2>📦 3. مسجل أوردرات متجري (لحفظ بيانات الزبون مؤقتاً)</h2>
            <div class="form-grid">
                <div class="form-group full">
                    <label>اسم العميل الثلاثي:</label>
                    <input type="text" id="custName" placeholder="مثال: محمد أحمد علي">
                </div>
                <div class="form-group">
                    <label>رقم تليفون العميل:</label>
                    <input type="text" id="custPhone" placeholder="مثال: 010xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل:</label>
                    <input type="text" id="custAddress" placeholder="المحافظة، المركز، الشارع">
                </div>
            </div>
            <button onclick="saveOrder()" style="background-color: #10b981; color: white;">💾 حفظ بيانات الأوردر للنسخ السريع</button>
            
            <div id="savedOrdersList" style="margin-top: 15px; font-size: 11px; color: var(--text-muted); line-height: 1.6;"></div>
        </div>

    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                output.style.display = 'block';
            };
            if(event.target.files[0]){
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function runAnalysis() {
            const name = document.getElementById('productName').value.trim() || "المنتج الخاص بك";
            const base = parseFloat(document.getElementById('basePrice').value) || 0;
            const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
            const currency = document.getElementById('currencyType').value;
            
            if(!name || base === 0 || sell === 0) {
                alert("الرجاء إدخال اسم المنتج وسعر الشراء وسعر البيع بشكل صحيح!");
                return;
            }

            if(sell <= base) {
                alert("تأكد أن سعر البيع للعميل أكبر من سعر الشراء من الجملة!");
                return;
            }

            const netProfit = sell - base;
            const isGoodProfit = netProfit >= 50;

            let resBox = document.getElementById('analysisResult');
            resBox.style.display = 'block';
            resBox.innerHTML = `
                <div class="result-section">
                    <div class="result-title">🎯 المنتج المستهدف:</div>
                    <p style="color: var(--accent-gold); font-weight: bold; word-break: break-all;">${name}</p>
                </div>

                <div class="result-section">
                    <div class="result-title">📊 1. الصافي الواقعي لأرباح الدروبشيبينغ</div>
                    <p>سعر الجملة: <b>${base} ${currency}</b> | سعر البيع: <b>${sell} ${currency}</b></p>
                    <p>صافي مكسبك الحقيقي (بعد خصم سعر الجملة): <b style="color: var(--success);">${netProfit} ${currency}</b> للأوردر الواحد</p>
                    <p>${isGoodProfit ? '<span class="badge-tag badge-success">هامش ربح ممتاز</span>' : '<span class="badge-tag badge-danger">هامش ربح ضعيف</span>'}</p>
                </div>

                <div class="result-section">
                    <div class="result-title">🌐 2. خطة النشر المجانية 100% عبر المنصات الأربع</div>
                    <p><b>• فيسبوك (Facebook):</b> انشر صور المنتج بأسلوب جذاب في (Marketplace) لثلاث محافظات يومياً، وانضم لجروبات (تسوق من الإنترنت، ستات بيوت) واطلب كتابة "مهتم" بالتعليقات للرد على الخاص.</p>
                    <p><b>• تيك توك (TikTok):</b> اصنع فيديو قصير مجاني من صور المنتج باستخدام تطبيقات الموبايل مثل CapCut، وركز على إبراز المشكلة والحل.</p>
                    <p><b>• إنستجرام (Instagram):</b> انشر نفس الفيديو على (Reels) وانشر يومياً في (Stories) استطلاعات رأي تفاعلية مع المهتمين عبر الرسائل المباشرة DM.</p>
                    <p><b>• تليجرام (Telegram):</b> أنشئ قناتك الخاصة لعرض منتجاتك المتاحة بانتظام وزيادة قاعدة متابعيك.</p>
                </div>

                <div class="result-section">
                    <div class="result-title">📢 3. سكريبت تيك توك / ريلز جاهز للنسخ</div>
                    <div class="copy-box">لو بتدور على (${name}) وبتخاف تتنصب عليك.. اسمع الكلمتين دول للاخر!
المنتج ده جربته بنفسي ولقيت فيه المواصفات الحقيقية، ودبرت لكم رابط التوكيل الموثوق عليه خصم.
اطلب المنتج من متجري والوصول والشحن لحد باب البيت!</div>
                </div>

                <div class="result-section">
                    <div class="result-title">🛑 4. طوارئ وخطة العمل (Kill-Switch)</div>
                    <p>• لو عرضت المنتج ومجاش عليه أي تفاعل بعد فترة، غيره فوراً بمنتج تاني وراقب الأداء.</p>
                </div>
            `;
            resBox.scrollIntoView({ behavior: 'smooth' });
        }

        function getHelp() {
            let prob = document.getElementById('userProblem').value;
            let helpBox = document.getElementById('helpResult');
            if(!prob) {
                helpBox.style.display = 'none';
                return;
            }
            
            helpBox.style.display = 'block';
            let solutions = {
                "1": "🛠️ **الحل لو محدش شاف المنتج:**\n• متجرك لسه محتاج استمرارية؛ نشر يومي على الفيسبوك (Marketplace وجروبات) وتيك توك وإنستجرام بانتظام.\n• تأكد أن صورة المنتج واضحة وجذابة جداً من أول نظرة.",
                "2": "🛠️ **الحل لو فيه مشاهدات ومفيش أوردرات:**\n• راجع طريقة عرض السعر ووصف المنتج على متجرك.\n• اعرض المنتج كأنه (عرض خاص لفترة محدودة أو خصم خاص) لتشجيع العميل على الشراء الفوري.",
                "3": "🛠️ **الحل لو الناس بتسأل ومش بيكملوا:**\n• رد على العميل في أسرع وقت وبأسلوب ودود جداً، ووضّح له تفاصيل الشحن والمحافظات ببساطة.",
                "4": "🛠️ **خطتك للبيع بدون مليم (مجان تام):**\n• اعتمد 100% على الـ Organic Traffic (الفيديوهات المجانية، النشر اليدوي في الميكرو-ماركت بليس، والرد المستمر على التعليقات)."
            };
            helpBox.innerHTML = solutions[prob];
            helpBox.scrollIntoView({ behavior: 'smooth' });
        }

        function saveOrder() {
            let name = document.getElementById('custName').value.trim();
            let phone = document.getElementById('custPhone').value.trim();
            let address = document.getElementById('custAddress').value.trim();

            if(!name || !phone) {
                alert("من فضلك اكتب اسم العميل ورقم التليفون على الأقل.");
                return;
            }

            let list = document.getElementById('savedOrdersList');
            list.innerHTML += `✅ أوردر محفوظ: <b>${name}</b> | 📞 ${phone} | 🏠 ${address || 'بدون عنوان'}<br>`;
            alert("تم حفظ بيانات الزبون بنجاح! تقدر تنسخها وتحطها في موقع الجملة الأساسي.");
            
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custAddress').value = '';
        }

        function resetFormForNextProduct() {
            document.getElementById('productName').value = '';
            document.getElementById('basePrice').value = '';
            document.getElementById('sellPrice').value = '';
            document.getElementById('productImageInput').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('analysisResult').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
