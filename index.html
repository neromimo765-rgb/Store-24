<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-24 | المتجر الرئيسي</title>
    <style>
        :root {
            --bg-primary: #0B0B10;
            --bg-card: #151522;
            --accent-gold: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #EF4444;
            --success: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 15px; padding-bottom: 70px; }

        .container { max-width: 480px; margin: 0 auto; }

        .store-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .store-header h1 { color: var(--accent-gold); font-size: 18px; }
        
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .music-btn { background: var(--bg-card); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 6px 12px; border-radius: 8px; font-size: 11px; text-decoration: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        .welcome-banner { background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(21, 21, 34, 0.8)); border: 1px solid var(--accent-gold); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 11px; color: var(--accent-gold); text-align: center; font-weight: bold; }

        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; scrollbar-width: none; }
        .categories-bar::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 11px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: bold; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }
        
        .product-media-box { width: 100%; height: 130px; background: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .product-media-box img, .product-media-box video { width: 100%; height: 100%; object-fit: cover; }

        .product-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-title { font-size: 12px; color: #fff; margin-bottom: 5px; font-weight: bold; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 13px; color: var(--accent-gold); font-weight: 800; }

        /* نافذة تفاصيل المنتج وتكبيره والتعليقات (Modal) محسنة بالكامل */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--accent-gold); width: 100%; max-width: 450px; max-height: 95vh; border-radius: 16px; overflow-y: auto; padding: 15px; position: relative; }
        .close-modal { position: absolute; top: 12px; left: 12px; background: var(--danger); color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        
        .modal-media { width: 100%; height: 240px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .modal-media img, .modal-media video { width: 100%; height: 100%; object-fit: contain; }
        
        .comments-section { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .comment-box { background: var(--bg-primary); padding: 9px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; border: 1px solid var(--border-color); }
        .comment-input, .comment-name { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 8px; font-size: 11px; margin-bottom: 8px; outline: none; }
        .rating-select { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--accent-gold); padding: 8px; border-radius: 8px; font-size: 11px; margin-bottom: 8px; outline: none; font-weight: bold; }
        .submit-comment-btn { width: 100%; background: var(--accent-gold); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; }

        .empty-msg { grid-column: span 2; text-align: center; color: var(--text-muted); font-size: 12px; padding: 30px; }
    </style>
</head>
<body>

    <!-- موسيقى خلفية تعمل برابط مباشر وآمن -->
    <audio id="storeAudio" loop preload="auto">
        <source src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" type="audio/ogg">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <div class="store-header">
            <h1>🛒 Store-24</h1>
            <div class="header-actions">
                <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">🔇 تشغيل الموسيقى</button>
            </div>
        </div>

        <div class="welcome-banner" id="welcomeMessage">أهلاً بك في Store-24! 🌟</div>

        <div class="categories-bar" id="categoriesBar">
            <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
            <button class="cat-btn" onclick="filterCategory('أدوات منزلية', this)">🚿 أدوات منزلية</button>
            <button class="cat-btn" onclick="filterCategory('إلكترونيات', this)">⚡ إلكترونيات</button>
            <button class="cat-btn" onclick="filterCategory('ملابس', this)">👕 ملابس</button>
            <button class="cat-btn" onclick="filterCategory('مستلزمات حيوانات أليفة', this)">🐾 مستلزمات حيوانات أليفة</button>
            <button class="cat-btn" onclick="filterCategory('الصحة والجمال', this)">💄 الصحة والجمال</button>
            <button class="cat-btn" onclick="filterCategory('أجهزة كمبيوتر', this)">💻 أجهزة كمبيوتر</button>
            <button class="cat-btn" onclick="filterCategory('عروض خاصة', this)">🔥 عروض خاصة</button>
        </div>

        <div class="products-grid" id="storeProductsGrid"></div>
    </div>

    <!-- نافذة عرض المنتج وتكبيره مع التعليقات -->
    <div class="modal-overlay" id="productModal" onclick="closeModalOnOutside(event)">
        <div class="modal-content" id="modalContainer">
            <button class="close-modal" onclick="closeProductModal()">×</button>
            <div id="modalBodyContent"></div>
        </div>
    </div>

    <script>
        let currentCategory = 'الكل';

        window.addEventListener('DOMContentLoaded', () => {
            setRandomWelcomeMessage();
            loadStoreProducts();
        });

        function setRandomWelcomeMessage() {
            const messages = [
                "✨ أهلاً بك في Store-24! استمتع بأقوى العروض والمنتجات المميزة اليوم.",
                "👋 نورت المتجر يا غالي! اكتشف أحدث الكتالوجات والمنتجات المختارة خصيصاً لك.",
                "🔥 أهلاً بك! تسوق الآن بكل سهولة واحصل على أفضل المنتجات بأفضل الأسعار.",
                "💎 سعادتنا زيارتك لمتجرنا! تصفح الأقسام واختر ما يناسبك بكل مرونة."
            ];
            document.getElementById('welcomeMessage').innerText = messages[Math.floor(Math.random() * messages.length)];
        }

        function toggleMusic() {
            let audio = document.getElementById('storeAudio');
            let btn = document.getElementById('musicToggleBtn');
            if (audio.paused) {
                audio.play().then(() => {
                    btn.innerHTML = "🎵 إيقاف الموسيقى";
                    btn.style.borderColor = "var(--success)";
                    btn.style.color = "#10B981";
                }).catch(() => {
                    alert('يرجى النقر مرة أخرى للسماح بتشغيل الموسيقى في المتجر.');
                });
            } else {
                audio.pause();
                btn.innerHTML = "🔇 تشغيل الموسيقى";
                btn.style.borderColor = "var(--accent-gold)";
                btn.style.color = "var(--accent-gold)";
            }
        }

        function loadStoreProducts() {
            let data = localStorage.getItem('store_products');
            let products = data ? JSON.parse(data) : [];
            let grid = document.getElementById('storeProductsGrid');

            let filtered = currentCategory === 'الكل' ? products : products.filter(p => p.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-msg">لا توجد منتجات مضافة في هذا القسم حالياً.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                let mediaHtml = `<div style="color:#555; font-size:10px;">بدون وسائط</div>`;
                if (p.images && p.images.length > 0) {
                    let media = p.images[0];
                    if (media.type === 'video' || (media.src && (media.src.includes('.mp4') || media.src.includes('video')))) {
                        mediaHtml = `<video src="${media.src}" muted autoplay loop playsinline></video>`;
                    } else if (media.src) {
                        mediaHtml = `<img src="${media.src}" alt="${p.name}" onerror="this.onerror=null; this.parentElement.innerHTML='خطأ بالرابط';">`;
                    }
                }

                return `
                    <div class="product-card" onclick="openProductModal(${p.id})">
                        <div class="product-media-box">
                            ${mediaHtml}
                        </div>
                        <div class="product-body">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} ج.م</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            loadStoreProducts();
        }

        function openProductModal(id) {
            let data = localStorage.getItem('store_products');
            let products = data ? JSON.parse(data) : [];
            let p = products.find(item => item.id === id);
            if (!p) return;

            if (!p.comments) p.comments = [];

            let mediaHtml = `<div style="color:#777; font-size:12px;">بدون وسائط</div>`;
            if (p.images && p.images.length > 0) {
                let media = p.images[0];
                if (media.type === 'video' || (media.src && media.src.includes('.mp4'))) {
                    mediaHtml = `<video src="${media.src}" controls autoplay loop playsinline style="width:100%;height:100%;object-fit:contain;"></video>`;
                } else {
                    mediaHtml = `<img src="${media.src}" style="width:100%;height:100%;object-fit:contain;">`;
                }
            }

            let commentsHtml = p.comments.map(c => `
                <div class="comment-box">
                    <div style="display:flex; justify-content:space-between; margin-bottom:3px;">
                        <strong>${c.name}</strong>
                        <span style="color:var(--accent-gold);">${'⭐'.repeat(c.rating)}</span>
                    </div>
                    <p style="color:#ccc; line-height:1.3;">${c.text}</p>
                </div>
            `).join('') || `<p style="font-size:11px; color:var(--text-muted); text-align:center; padding:10px;">كن أول من يترك تقييماً وتعليقاً على هذا المنتج!</p>`;

            let html = `
                <div class="modal-media">${mediaHtml}</div>
                <h3 style="color:var(--accent-gold); font-size:16px; margin-bottom:6px;">${p.name}</h3>
                <div style="font-size:15px; font-weight:bold; color:#fff; margin-bottom:8px;">${p.price} ج.م</div>
                <p style="font-size:12px; color:var(--text-muted); margin-bottom:15px; line-height:1.5;">${p.desc || 'لا يوجد وصف تفصيلي متاح لهذا المنتج حالياً.'}</p>
                
                <div class="comments-section">
                    <h4 style="font-size:13px; margin-bottom:10px; color:#fff;">💬 تقييمات وآراء العملاء</h4>
                    <div style="max-height: 160px; overflow-y: auto; margin-bottom: 10px;" id="commentsList">${commentsHtml}</div>
                    
                    <input type="text" id="commName" class="comment-name" placeholder="اكتب اسمك الكريم...">
                    <select id="commRating" class="rating-select">
                        <option value="5">⭐⭐⭐⭐⭐ (ممتاز جداً)</option>
                        <option value="4">⭐⭐⭐⭐ (جيد جداً)</option>
                        <option value="3">⭐⭐⭐ (مقبول)</option>
                        <option value="2">⭐⭐ (ضعيف)</option>
                        <option value="1">⭐ (سيء)</option>
                    </select>
                    <textarea id="commText" class="comment-input" rows="2" placeholder="اكتب تعليقك ورأيك في المنتج..."></textarea>
                    <button class="submit-comment-btn" onclick="addComment(${p.id})">إرسال التقييم والتعليق 🚀</button>
                </div>
            `;

            document.getElementById('modalBodyContent').innerHTML = html;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function closeModalOnOutside(event) {
            if (event.target.id === 'productModal') closeProductModal();
        }

        function addComment(productId) {
            let name = document.getElementById('commName').value.trim();
            let rating = parseInt(document.getElementById('commRating').value);
            let text = document.getElementById('commText').value.trim();

            if (!name || !text) {
                alert('الرجاء إدخال الاسم والتعليق قبل الإرسال.');
                return;
            }

            let data = localStorage.getItem('store_products');
            let products = data ? JSON.parse(data) : [];
            let p = products.find(item => item.id === productId);
            if (p) {
                if (!p.comments) p.comments = [];
                p.comments.unshift({ name, rating, text });
                localStorage.setItem('store_products', JSON.stringify(products));
                openProductModal(productId); // إعادة فتح النافذة لتحديث قائمة التعليقات فوراً
            }
        }
    </script>
</body>
</html>
