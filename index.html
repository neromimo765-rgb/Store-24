<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الأساسي</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #181824;
            --accent-gold: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 70px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; padding: 16px; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }
        header h1 { font-size: 16px; color: var(--accent-gold); font-weight: 800; }

        /* زر مشغل موسيقى البحر الهادئة */
        .music-control-btn {
            background: var(--bg-card); border: 1px solid var(--accent-gold); color: var(--accent-gold);
            padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 5px; transition: 0.2s;
        }
        .music-control-btn:active { transform: scale(0.95); }

        /* شبكة عرض المنتجات */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .product-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
            transition: transform 0.2s;
        }
        .product-card:active { transform: scale(0.98); }
        .product-img { width: 100%; height: 140px; object-fit: cover; background: #000; }
        .product-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-title { font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #fff; }
        .product-price { font-size: 13px; color: var(--accent-gold); font-weight: 900; }

        /* نافذة تفاصيل المنتج (Modal) */
        #productModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 16, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 3000; padding: 16px;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border-color);
            width: 100%; max-width: 420px; border-radius: 16px; padding: 16px;
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .close-modal {
            position: absolute; top: 12px; left: 12px; background: var(--accent-red);
            color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%;
            font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .modal-main-img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .modal-thumbs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
        .modal-thumbs img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; opacity: 0.6; }
        .modal-thumbs img.active { opacity: 1; border-color: var(--accent-gold); }
        .modal-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .modal-price { font-size: 16px; color: var(--accent-gold); font-weight: 900; margin-bottom: 10px; }
        .modal-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; white-space: pre-wrap; }
        
        .buy-btn {
            width: 100%; background: var(--success); color: #fff; border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;
        }

        /* نافذة تكبير الصورة بملء الشاشة (Lightbox) */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 4000;
        }
        #lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }
        #lightbox-close { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; z-index: 4001; }

        .loading-text { text-align: center; color: var(--text-muted); font-size: 12px; grid-column: span 2; padding: 30px; }
    </style>
</head>
<body>

    <!-- عنصر الصوت (موسيقى البحر الهادئة) -->
    <audio id="seaAudio" loop>
        <source src="https://actions.google.com/sounds/v1/water/waves_ocean_surf.ogg" type="audio/ogg">
        متصفحك لا يدعم تشغيل الصوت.
    </audio>

    <div class="container">
        <header>
            <h1>🛍️ متجرنا الأساسي</h1>
            <button id="musicBtn" class="music-control-btn" onclick="toggleSeaMusic()">🌊 صوت البحر: متوقف</button>
        </header>

        <!-- شبكة عرض المنتجات -->
        <div id="productsGrid" class="products-grid">
            <p class="loading-text">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- نافذة تفاصيل المنتج (Modal) -->
    <div id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeProductModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- نافذة تكبير الصورة (Lightbox) -->
    <div id="lightbox">
        <button id="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightboxImg" src="" alt="صورة مكبرة">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = {};

        // تحكم في تشغيل وإيقاف موسيقى البحر
        window.toggleSeaMusic = function() {
            const audio = document.getElementById('seaAudio');
            const btn = document.getElementById('musicBtn');
            if (audio.paused) {
                audio.play().then(() => {
                    btn.innerHTML = '🌊 صوت البحر: يعمل';
                    btn.style.borderColor = 'var(--success)';
                    btn.style.color = 'var(--success)';
                }).catch(e => console.log(e));
            } else {
                audio.pause();
                btn.innerHTML = '🌊 صوت البحر: متوقف';
                btn.style.borderColor = 'var(--accent-gold)';
                btn.style.color = 'var(--accent-gold)';
            }
        }

        async function loadStoreProducts() {
            try {
                const snap = await get(ref(db, 'products'));
                const grid = document.getElementById('productsGrid');
                
                if (!snap.exists()) {
                    grid.innerHTML = `<p class="loading-text">لا توجد منتجات مضافة حالياً.</p>`;
                    return;
                }

                allProducts = snap.val();
                let html = '';

                for (let id in allProducts) {
                    const p = allProducts[id];
                    const mainImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/150';
                    
                    html += `
                        <div class="product-card" onclick="openProductModal('${id}')">
                            <img src="${mainImg}" class="product-img" alt="${p.title}">
                            <div class="product-info">
                                <div class="product-title">${p.title}</div>
                                <div class="product-price">${p.price} ج.م</div>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = html;

                // فحص الرابط لفتح المنتج تلقائياً لو تم القدوم من رابط مشاركة
                const urlParams = new URLSearchParams(window.location.search);
                const productIdFromUrl = urlParams.get('id');
                if (productIdFromUrl && allProducts[productIdFromUrl]) {
                    openProductModal(productIdFromUrl);
                }

            } catch (e) {
                console.error(e);
                document.getElementById('productsGrid').innerHTML = `<p class="loading-text">حدث خطأ أثناء تحميل المنتجات.</p>`;
            }
        }

        window.openProductModal = function(id) {
            const p = allProducts[id];
            if (!p) return;

            let images = p.images || ['https://via.placeholder.com/300'];
            let thumbsHtml = '';
            images.forEach((img, index) => {
                thumbsHtml += `<img src="${img}" class="${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)" alt="صورة مصغرة">`;
            });

            let modalBody = `
                <img src="${images[0]}" id="modalMainImg" class="modal-main-img" onclick="openLightbox(this.src)" alt="${p.title}">
                <div class="modal-thumbs">${thumbsHtml}</div>
                <div class="modal-title">${p.title}</div>
                <div class="modal-price">${p.price} ج.م</div>
                <div class="modal-desc">${p.desc || 'لا يوجد وصف متاح.'}</div>
                <button class="buy-btn" onclick="orderProduct('${p.title}', '${p.price}')">طلب المنتج الآن 🛒</button>
            `;

            document.getElementById('modalBody').innerHTML = modalBody;
            document.getElementById('productModal').style.display = 'flex';
        }

        window.closeProductModal = function() {
            document.getElementById('productModal').style.display = 'none';
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        window.changeMainImage = function(src, thumbElement) {
            document.getElementById('modalMainImg').src = src;
            document.querySelectorAll('.modal-thumbs img').forEach(img => img.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        // تكبير الصورة بملء الشاشة عند النقر عليها
        window.openLightbox = function(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        window.closeLightbox = function() {
            document.getElementById('lightbox').style.display = 'none';
        }

        window.orderProduct = function(title, price) {
            const message = encodeURIComponent(`مرحباً، أريد طلب هذا المنتج:\n*${title}*\nالسعر: ${price} ج.م`);
            window.open(`https://api.whatsapp.com/send?phone=201000000000&text=${message}`, '_blank');
        }

        window.addEventListener('DOMContentLoaded', loadStoreProducts);
    </script>
</body>
</html>
