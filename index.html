<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-24 - المتجر الأساسي</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #181824;
            --accent-gold: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; padding: 16px; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        .store-title { font-size: 16px; color: var(--accent-gold); font-weight: 900; display: flex; align-items: center; gap: 5px; }
        .cart-badge {
            background: var(--bg-card); border: 1px solid var(--border-color); color: #fff;
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        
        .notice-bar {
            background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-gold); padding: 8px 12px; border-radius: 8px; font-size: 11px;
            text-align: center; margin-bottom: 15px; font-weight: bold;
        }

        /* شريط الأقسام الأفقي */
        .categories-container {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
            scrollbar-width: none;
        }
        .categories-container::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        /* كارت المنتج */
        .product-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; overflow: hidden; margin-bottom: 15px; padding: 12px;
        }
        .product-status { font-size: 10px; background: rgba(16, 185, 129, 0.2); color: var(--success); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; font-weight: bold; }
        .product-title { font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #fff; }
        .product-price { font-size: 14px; color: var(--accent-gold); font-weight: 900; margin-bottom: 10px; }
        
        .media-box { width: 100%; height: 200px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; position: relative; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }

        .btn-add-cart {
            width: 100%; background: var(--accent-gold); color: #000; border: none;
            padding: 10px; border-radius: 8px; font-weight: 900; font-size: 12px; cursor: pointer;
            margin-bottom: 8px;
        }
        
        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .social-btn { padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; text-align: center; color: #fff; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 4px; }
        .whatsapp-btn { background: #25D366; }
        .facebook-btn { background: #1877F2; }
        .tiktok-btn { background: #000000; border: 1px solid var(--border-color); }
        
        .loading-text { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="store-title">Store-24 🛒</div>
            <div class="cart-badge" onclick="alert('سلة المشتريات فارغة حالياً')">🛒 السلة <span id="cartCount">0</span></div>
        </header>

        <div class="notice-bar">
            🔥 أقوى المنتجات بأفضل الأسعار وبجودة ممتازة في انتظارك اليوم.
        </div>

        <!-- الأقسام -->
        <div class="categories-container" id="categoriesContainer">
            <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
            <button class="cat-btn" onclick="filterCategory('أدوات منزلية', this)">🚀 أدوات منزلية</button>
            <button class="cat-btn" onclick="filterCategory('إلكترونيات', this)">📱 إلكترونيات</button>
            <button class="cat-btn" onclick="filterCategory('إكسسوارات', this)">⌚ إكسسوارات</button>
        </div>

        <!-- قائمة المنتجات -->
        <div id="storeProductsList">
            <div class="loading-text">جاري تحميل المنتجات...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = {};
        let currentCategory = 'الكل';

        async function loadStoreProducts() {
            try {
                const snap = await get(ref(db, 'products'));
                const container = document.getElementById('storeProductsList');
                
                if (!snap.exists()) {
                    container.innerHTML = `<div class="loading-text">لا توجد منتجات مضافة حالياً في المتجر.</div>`;
                    return;
                }

                allProducts = snap.val();
                renderProducts();
            } catch (e) {
                document.getElementById('storeProductsList').innerHTML = `<div class="loading-text" style="color:var(--accent-red);">حدث خطأ أثناء تحميل المنتجات.</div>`;
            }
        }

        window.filterCategory = function(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('storeProductsList');
            let html = '';
            let found = false;

            for (let id in allProducts) {
                const p = allProducts[id];
                if (currentCategory !== 'الكل' && p.category !== currentCategory) continue;

                found = true;
                let mediaHtml = '';
                if (p.images && p.images.length > 0) {
                    mediaHtml = `<div class="media-box"><img src="${p.images[0]}" alt="${p.title}"></div>`;
                } else if (p.videoUrl) {
                    mediaHtml = `<div class="media-box"><video src="${p.videoUrl}" controls></video></div>`;
                } else {
                    mediaHtml = `<div class="media-box" style="display:flex;justify-content:center;align-items:center;color:var(--text-muted);font-size:11px;">بدون وسائط</div>`;
                }

                html += `
                    <div class="product-card">
                        <span class="product-status">متوفر</span>
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} ج.م</div>
                        ${mediaHtml}
                        <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">${p.desc || ''}</div>
                        <button onclick="alert('تمت إضافة المنتج إلى السلة بنجاح!')" class="btn-add-cart">🛒 أضف للسلة</button>
                        <div class="social-grid">
                            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent('مرحباً، أهتم بشراء: ' + p.title + ' بسعر ' + p.price + ' ج.م')}" target="_blank" class="social-btn whatsapp-btn">واتساب</a>
                            <a href="https://www.facebook.com" target="_blank" class="social-btn facebook-btn">فيس بوك</a>
                            <a href="https://www.tiktok.com" target="_blank" class="social-btn tiktok-btn">تيك توك</a>
                        </div>
                    </div>
                `;
            }

            if (!found) {
                container.innerHTML = `<div class="loading-text">لا توجد منتجات في هذا القسم حالياً.</div>`;
            } else {
                container.innerHTML = html;
            }
        }

        window.addEventListener('DOMContentLoaded', loadStoreProducts);
    </script>
</body>
</html>
