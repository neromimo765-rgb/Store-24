<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الأساسي</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #181824;
            --accent-gold: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 70px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; padding: 16px; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }
        header h1 { font-size: 16px; color: var(--accent-gold); font-weight: 800; }

        .header-actions { display: flex; gap: 6px; align-items: center; }

        .currency-select {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--accent-gold);
            padding: 5px 8px; border-radius: 15px; font-size: 10px; font-weight: bold; cursor: pointer;
        }

        .cart-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 5px; position: relative;
        }
        .cart-badge {
            background: var(--accent-red); color: #fff; border-radius: 50%; padding: 2px 6px; font-size: 9px; font-weight: bold;
        }

        .welcome-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(24, 24, 36, 0.8));
            border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 10px; text-align: center;
            font-size: 11px; color: var(--accent-gold); font-weight: bold; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .music-section {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 10px; text-align: center; margin-bottom: 16px;
        }
        .music-control-btn {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
            border: 1px solid var(--accent-gold); color: var(--accent-gold);
            padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 900; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        .categories-scroll {
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px;
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 5px 12px; border-radius: 15px; font-size: 10px; font-weight: bold; cursor: pointer;
            white-space: nowrap;
        }
        .cat-chip.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative;
        }
        .product-img { width: 100%; height: 130px; object-fit: cover; background: #000; }
        .product-info { padding: 8px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-title { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #fff; }
        
        .product-stats {
            font-size: 9px; color: var(--text-muted); background: #0f0f13;
            padding: 5px; border-radius: 6px; margin: 5px 0; display: flex; justify-content: space-between; gap: 4px;
        }

        .price-box { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .product-price { font-size: 12px; color: var(--accent-gold); font-weight: 900; }
        .old-price { font-size: 10px; color: var(--text-muted); text-decoration: line-through; }
        .discount-badge { position: absolute; top: 6px; right: 6px; background: var(--accent-red); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 6px; font-weight: bold; z-index: 2; }

        .stock-status {
            font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; text-align: center;
        }
        .stock-in { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .stock-out { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 16, 0.95); display: none;
            justify-content: center; align-items: center; z-index: 3000; padding: 16px;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border-color);
            width: 100%; max-width: 400px; border-radius: 14px; padding: 14px;
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .close-modal {
            position: absolute; top: 10px; left: 10px; background: var(--accent-red);
            color: #fff; border: none; width: 26px; height: 26px; border-radius: 50%;
            font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 11px;
        }
        .modal-main-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .modal-thumbs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; }
        .modal-thumbs img { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border-color); cursor: pointer; opacity: 0.6; }
        .modal-thumbs img.active { opacity: 1; border-color: var(--accent-gold); }
        
        .btn-action {
            width: 100%; background: var(--accent-gold); color: #000; border: none;
            padding: 9px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; margin-top: 6px;
        }
        .btn-success { background: var(--success); color: #fff; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #0f0f13; padding: 6px; border-radius: 6px; margin-bottom: 6px; font-size: 11px; }

        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 4000;
        }
        #lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }
        #lightbox-close { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 24px; cursor: pointer; background: none; border: none; z-index: 4001; }

        .loading-text { text-align: center; color: var(--text-muted); font-size: 11px; grid-column: span 2; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛍️ متجرنا الأساسي</h1>
            <div class="header-actions">
                <select id="currencySelector" class="currency-select" onchange="changeCurrency(this.value)">
                    <option value="EGP">ج.م (مصري)</option>
                    <option value="SAR">ر.س (سعودي)</option>
                </select>
                <button class="cart-btn" onclick="openCartModal()">
                    🛒 السلة <span id="cartCount" class="cart-badge">0</span>
                </button>
            </div>
        </header>

        <div id="welcomeBanner" class="welcome-banner">
            <span>أهلاً بك في متجرنا! نتمنى لك تجربة تسوق ممتعة 🌟</span>
            <span id="globalVisitsBadge" style="display: none; background: rgba(245, 158, 11, 0.2); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--accent-gold);">👀 <span id="visitsCountText">0</span> زيارة</span>
        </div>

        <div class="music-section">
            <button id="musicBtn" class="music-control-btn" onclick="toggleEpicMusic()">⚡ فعل الموسيقى واستمتع 🚀</button>
        </div>

        <div class="categories-scroll" id="categoriesContainer">
            <div class="cat-chip active" onclick="filterCategory('الكل', this)">الكل 🌟</div>
            <div class="cat-chip" onclick="filterCategory('أدوات منزلية', this)">🚀 أدوات منزلية</div>
            <div class="cat-chip" onclick="filterCategory('إلكترونيات', this)">📱 إلكترونيات</div>
            <div class="cat-chip" onclick="filterCategory('إكسسوارات', this)">⌚ إكسسوارات</div>
            <div class="cat-chip" onclick="filterCategory('أخرى', this)">📦 أخرى</div>
        </div>

        <div id="productsGrid" class="products-grid">
            <p class="loading-text">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeProductModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeCartModal()">✕</button>
            <h3 style="font-size: 14px; color: var(--accent-gold); margin-bottom: 10px; font-weight: bold;">🛒 سلة المشتريات</h3>
            <div id="cartItemsList"></div>
            <div id="cartTotalContainer" style="margin-top: 10px; font-size: 12px; font-weight: bold; text-align: left; color: var(--accent-gold);"></div>
            <button class="btn-action btn-success" onclick="checkoutCart()" style="margin-top: 10px;">إتمام الطلب عبر واتساب 📱</button>
        </div>
    </div>

    <div id="lightbox">
        <button id="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightboxImg" src="" alt="صورة مكبرة">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = {};
        let cart = [];
        let currentCategory = 'الكل';
        let currentCurrency = 'EGP';

        const exchangeRates = { EGP: 1, SAR: 0.077 };
        const currencySymbols = { EGP: 'ج.م', SAR: 'ر.س' };

        let globalAudio = null;
        let isMusicPlaying = false;

        // تشغيل وإدارة الموسيقى بسلاسة وتخطي قيود المتصفحات
        window.toggleEpicMusic = function() {
            const btn = document.getElementById('musicBtn');
            
            if (!globalAudio) {
                globalAudio = new Audio('https://www.bensound.com/bensound-music/bensound-creativeminds.mp3');
                globalAudio.loop = true;
                globalAudio.volume = 0.4;
            }

            if (!isMusicPlaying) {
                globalAudio.play().then(() => {
                    isMusicPlaying = true;
                    btn.innerHTML = '🔥 الموسيقى الحماسية: تعمل (اضغط للإيقاف)';
                    btn.style.borderColor = 'var(--success)';
                    btn.style.color = 'var(--success)';
                }).catch(e => {
                    console.error("متصفحك يمنع التشغيل التلقائي:", e);
                    alert('⚠️ يجبرنا المتصفح على النقر مرة أخرى للسماح بالتشغيل. اضغط OK ثم اضغط الزر مجدداً.');
                });
            } else {
                globalAudio.pause();
                isMusicPlaying = false;
                btn.innerHTML = '⚡ فعل الموسيقى واستمتع 🚀';
                btn.style.borderColor = 'var(--accent-gold)';
                btn.style.color = 'var(--accent-gold)';
            }
        }

        // دالة لتوليد حركة عشوائية ذكية بناءً على معرف المنتج وزيارة الزبون (عشان الأرقام مبتبقاش جامدة)
        function getDynamicStats(productId, baseViews, baseBuyers) {
            let v = parseInt(baseViews) || 0;
            let b = parseInt(baseBuyers) || 0;

            if (v === 0 && b === 0) return '';

            // استخدام رقم عشوائي ثابت نسبياً لكل زائر في الجلسة بناءً على ID المنتج
            let storageKey = `stat_boost_${productId}`;
            let boost = localStorage.getItem(storageKey);
            
            if (!boost) {
                // إضافة عشوائية بسيطة لأول زيارة للعميل للمنتج (مثلا زيادة بين 1 إلى 4 مشاهدات)
                boost = Math.floor(Math.random() * 4) + 1;
                localStorage.setItem(storageKey, boost);
            }
            
            let finalViews = v + parseInt(boost);
            let finalBuyers = b;

            return `<div class="product-stats">
                ${finalViews > 0 ? `<span>👀 ${finalViews} مشاهدة</span>` : ''}
                ${finalBuyers > 0 ? `<span>🛍️ ${finalBuyers} مشترِ</span>` : ''}
            </div>`;
        }

        async function loadGlobalVisits() {
            try {
                const snap = await get(ref(db, 'settings/globalFakeVisits'));
                const badge = document.getElementById('globalVisitsBadge');
                const textElem = document.getElementById('visitsCountText');
                
                if (snap.exists() && snap.val() !== '') {
                    // حركة بسيطة لزيارات المتجر العامة لمنع الجمود التام
                    let baseVal = parseInt(snap.val()) || 50;
                    let visitKey = 'store_global_dynamic_boost';
                    let boost = sessionStorage.getItem(visitKey);
                    if(!boost) {
                        boost = Math.floor(Math.random() * 3);
                        sessionStorage.setItem(visitKey, boost);
                    }
                    textElem.innerText = baseVal + parseInt(boost);
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {
                console.error("خطأ في جلب زيارات المتجر العامة:", e);
            }
        }

        async function trackRealVisitor() {
            const visitorKey = 'store_visited_real';
            try {
                const vRef = ref(db, 'analytics/realVisitors');
                if (!localStorage.getItem(visitorKey)) {
                    localStorage.setItem(visitorKey, 'true');
                    const snap = await get(vRef);
                    const current = snap.exists() ? snap.val() : 0;
                    await set(vRef, current + 1);
                }
            } catch (e) {
                console.error("خطأ في تتبع الزوار:", e);
            }
        }
        trackRealVisitor();
        loadGlobalVisits();

        window.changeCurrency = function(curr) {
            currentCurrency = curr;
            renderProducts();
        }

        function formatPrice(val) {
            const rate = exchangeRates[currentCurrency];
            const converted = (parseFloat(val) * rate).toFixed(2);
            return `${converted} ${currencySymbols[currentCurrency]}`;
        }

        async function loadStoreProducts() {
            try {
                const snap = await get(ref(db, 'products'));
                if (!snap.exists()) {
                    document.getElementById('productsGrid').innerHTML = `<p class="loading-text">لا توجد منتجات مضافة حالياً في قاعدة البيانات.</p>`;
                    return;
                }
                allProducts = snap.val();
                renderProducts();

                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id');
                if (productId && allProducts[productId]) {
                    openProductModal(productId);
                }
            } catch (e) {
                console.error(e);
                document.getElementById('productsGrid').innerHTML = `<p class="loading-text">حدث خطأ أثناء تحميل المنتجات.</p>`;
            }
        }

        window.filterCategory = function(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            let html = '';
            let found = false;

            for (let id in allProducts) {
                const p = allProducts[id];
                const pCat = p.category || 'أدوات منزلية';
                if (currentCategory !== 'الكل' && pCat !== currentCategory) continue;

                found = true;
                const mainImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/150';
                
                let priceHtml = '';
                let discountBadgeHtml = '';

                if (p.salePrice && parseFloat(p.salePrice) > 0) {
                    discountBadgeHtml = `<div class="discount-badge">خصم</div>`;
                    priceHtml = `
                        <div class="price-box">
                            <span class="product-price">${formatPrice(p.salePrice)}</span>
                            <span class="old-price">${formatPrice(p.price)}</span>
                        </div>
                    `;
                } else {
                    priceHtml = `<div class="product-price">${formatPrice(p.price)}</div>`;
                }

                // تضمين نظام الحركة الحية للأرقام لكل منتج
                let statsHtml = getDynamicStats(id, p.fakeViews, p.fakeBuyers);

                const isAvailable = p.stock !== 'out';
                const stockBadge = isAvailable 
                    ? `<span class="stock-status stock-in">🟢 متوفر</span>` 
                    : `<span class="stock-status stock-out">🔴 غير متوفر</span>`;

                html += `
                    <div class="product-card" onclick="openProductModal('${id}')">
                        ${discountBadgeHtml}
                        <img src="${mainImg}" class="product-img" alt="${p.title}" loading="lazy">
                        <div class="product-info">
                            <div>
                                <div class="product-title">${p.title}</div>
                                ${priceHtml}
                                ${statsHtml}
                            </div>
                            <div>${stockBadge}</div>
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = found ? html : `<p class="loading-text">لا توجد منتجات في هذا القسم حالياً.</p>`;
        }

        window.openProductModal = async function(id) {
            const p = allProducts[id];
            if (!p) return;

            let images = p.images || ['https://via.placeholder.com/300'];
            let thumbsHtml = '';
            images.forEach((img, index) => {
                thumbsHtml += `<img src="${img}" class="${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)" alt="صورة مصغرة" loading="lazy">`;
            });

            let finalActivePrice = (p.salePrice && parseFloat(p.salePrice) > 0) ? p.salePrice : p.price;
            let modalPriceHtml = '';
            
            if (p.salePrice && parseFloat(p.salePrice) > 0) {
                modalPriceHtml = `
                    <div class="price-box" style="margin-bottom: 6px;">
                        <span style="font-size: 15px; color: var(--accent-gold); font-weight: 900;">${formatPrice(p.salePrice)}</span>
                        <span class="old-price" style="font-size: 12px;">${formatPrice(p.price)}</span>
                    </div>
                `;
            } else {
                modalPriceHtml = `<div style="font-size: 15px; color: var(--accent-gold); font-weight: 900; margin-bottom: 6px;">${formatPrice(p.price)}</div>`;
            }

            const isAvailable = p.stock !== 'out';
            const actionBtn = isAvailable 
                ? `<button class="btn-action" onclick="addToCart('${id}')">إضافة إلى السلة 🛒</button>
                   <button class="btn-action btn-success" onclick="orderDirect('${id}', '${p.title}', '${finalActivePrice}')">طلب المنتج عبر واتساب ⚡</button>`
                : `<button class="btn-action" style="background:#555; color:#aaa; cursor:not-allowed;" disabled>المنتج غير متوفر حالياً 🔴</button>`;

            let modalBody = `
                <img src="${images[0]}" id="modalMainImg" class="modal-main-img" onclick="openLightbox(this.src)" alt="${p.title}">
                <div class="modal-thumbs">${thumbsHtml}</div>
                <div style="font-size: 13px; font-weight: bold; margin-bottom: 4px; color:#fff;">${p.title}</div>
                ${modalPriceHtml}
                <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; white-space: pre-wrap;">${p.desc || 'لا يوجد وصف متاح.'}</div>
                ${actionBtn}
            `;

            document.getElementById('modalBody').innerHTML = modalBody;
            document.getElementById('productModal').style.display = 'flex';
        }

        window.closeProductModal = function() {
            document.getElementById('productModal').style.display = 'none';
        }

        window.changeMainImage = function(src, thumbElement) {
            document.getElementById('modalMainImg').src = src;
            document.querySelectorAll('.modal-thumbs img').forEach(img => img.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        window.openLightbox = function(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        window.closeLightbox = function() {
            document.getElementById('lightbox').style.display = 'none';
        }

        window.addToCart = function(id) {
            const p = allProducts[id];
            let activePrice = (p.salePrice && parseFloat(p.salePrice) > 0) ? p.salePrice : p.price;
            cart.push({ id, title: p.title, price: activePrice });
            document.getElementById('cartCount').innerText = cart.length;
            alert('تمت إضافة المنتج إلى السلة بنجاح!');
            closeProductModal();
        }

        window.openCartModal = function() {
            const container = document.getElementById('cartItemsList');
            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 11px; padding: 15px;">السلة فارغة حالياً.</p>`;
                document.getElementById('cartTotalContainer').innerText = '';
                document.getElementById('cartModal').style.display = 'flex';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += parseFloat(item.price || 0);
                html += `
                    <div class="cart-item">
                        <span><b>${item.title}</b><br>${formatPrice(item.price)}</span>
                        <button onclick="removeFromCart(${index})" style="background:var(--accent-red); color:#fff; border:none; padding:3px 6px; border-radius:4px; cursor:pointer;">حذف</button>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cartTotalContainer').innerText = `الإجمالي الكلي: ${formatPrice(total)}`;
            document.getElementById('cartModal').style.display = 'flex';
        }

        window.closeCartModal = function() {
            document.getElementById('cartModal').style.display = 'none';
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            document.getElementById('cartCount').innerText = cart.length;
            openCartModal();
        }

        async function recordRealPurchase(productIdsList) {
            const buyerKey = 'store_buyer_real';
            try {
                if (!localStorage.getItem(buyerKey)) {
                    localStorage.setItem(buyerKey, 'true');
                    const bRef = ref(db, 'analytics/realBuyers');
                    const snap = await get(bRef);
                    const current = snap.exists() ? snap.val() : 0;
                    await set(bRef, current + 1);
                }

                for (let id of productIdsList) {
                    const pSalesRef = ref(db, `productSales/${id}`);
                    const snap = await get(pSalesRef);
                    const currentSales = snap.exists() ? snap.val() : 0;
                    await set(pSalesRef, currentSales + 1);
                }
            } catch (e) {
                console.error("خطأ في تسجيل عملية الشراء:", e);
            }
        }

        window.checkoutCart = function() {
            if (cart.length === 0) return;
            let text = 'مرحباً، أريد طلب المنتجات التالية:\n';
            let productIds = [];
            cart.forEach((item, i) => {
                text += `${i+1}. ${item.title} - ${formatPrice(item.price)}\n`;
                productIds.push(item.id);
            });
            recordRealPurchase(productIds);
            
            window.open(`https://api.whatsapp.com/send?phone=201156666967&text=${encodeURIComponent(text)}`, '_blank');
        }

        window.orderDirect = function(id, title, price) {
            recordRealPurchase([id]);
            const message = encodeURIComponent(`مرحباً، أريد طلب هذا المنتج:\n*${title}*\nالسعر: ${formatPrice(price)}`);
            
            window.open(`https://api.whatsapp.com/send?phone=201156666967&text=${message}`, '_blank');
        }

        window.addEventListener('DOMContentLoaded', loadStoreProducts);
    </script>
</body>
</html>
