<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-24 | المتجر الرسمي</title>
    <style>
        :root {
            --bg-primary: #0F0F1A;
            --bg-card: #1E1E32;
            --accent-gold: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #A0A0B0;
            --whatsapp-green: #25D366;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 110px; }

        .announcement-bar { background: var(--accent-gold); color: #000; font-size: 11px; font-weight: 800; text-align: center; padding: 6px; overflow: hidden; white-space: nowrap; }

        header { background: var(--bg-card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        header h1 { font-size: 18px; color: var(--accent-gold); font-weight: 900; }

        .hero { padding: 30px 20px; text-align: center; background: linear-gradient(180deg, rgba(30,30,50,0.8) 0%, var(--bg-primary) 100%); }
        .hero h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .hero p { font-size: 12px; color: var(--text-muted); }

        .container { padding: 0 15px; max-width: 600px; margin: 0 auto; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; position: relative; }
        
        .card-media { height: 180px; background: rgba(245, 158, 11, 0.05); border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; position: relative; }
        .card-media img, .card-media video { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .badge { position: absolute; top: 8px; right: 8px; background: var(--accent-gold); color: #000; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 5px; z-index: 2; }
        
        .card h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
        .card p { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
        .price-row { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 10px; margin-bottom: 10px; }
        .price { color: var(--accent-gold); font-weight: 800; font-size: 15px; }
        .btn { background: var(--accent-gold); border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; color: #000; }

        /* قسم التقييمات والآراء (زي أمازون) */
        .reviews-section { background: #0F0F1A; border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px solid var(--border-color); }
        .reviews-title { font-size: 11px; color: var(--accent-gold); font-weight: 700; margin-bottom: 8px; }
        .review-list { max-height: 90px; overflow-y: auto; margin-bottom: 8px; }
        .review-item { font-size: 11px; border-bottom: 1px dashed var(--border-color); padding: 5px 0; }
        .review-item strong { color: #fff; }
        .review-input-group { display: flex; gap: 5px; }
        .review-input-group input { flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); color: #fff; padding: 6px; border-radius: 6px; font-size: 10px; outline: none; }
        .review-input-group button { background: var(--accent-gold); border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer; color: #000; }

        /* نافذة بيانات العميل وإتمام الطلب */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--accent-gold); border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; }
        .modal-content h3 { color: var(--accent-gold); font-size: 16px; margin-bottom: 15px; font-weight: 800; text-align: center; }
        .input-field { width: 100%; background: #0F0F1A; border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; outline: none; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(30, 30, 50, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .cart-info { font-size: 13px; font-weight: 700; }
        .cart-info span { color: var(--accent-gold); }
        .whatsapp-checkout-btn { background: var(--whatsapp-green); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <div class="announcement-bar">
        ⚡ شحن سريع لجميع المحافظات المصرية | اطلب الآن واكتشف أحدث العروض 🔥
    </div>

    <header>
        <h1>Store-24 🛒</h1>
        <!-- واجهة نظيفة تماماً للعميل بدون أي أزرار تحكم أو تعديل -->
    </header>

    <div class="hero">
        <h2>تسوق أحدث المنتجات بأفضل الأسعار</h2>
        <p>اختار منتجاتك، اكتب بياناتك ومحافظتك بكل سهولة، واطلب مباشرة.</p>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <!-- نافذة إدخال بيانات العميل والمحافظة -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h3>📝 أدخل بيانات الشحن والتوصيل</h3>
            <input type="text" id="cName" class="input-field" placeholder="الاسم الكامل">
            <input type="tel" id="cPhone" class="input-field" placeholder="رقم الموبايل (التواصل)">
            <input type="text" id="cCity" class="input-field" placeholder="المحافظة (مثال: القاهرة، الجيزة، الإسكندرية)">
            <input type="text" id="cAddress" class="input-field" placeholder="العنوان بالتفصيل (الشارع، رقم الهيكل)">
            <button class="whatsapp-checkout-btn" onclick="submitOrder()" style="width: 100%; justify-content: center; margin-top: 5px; padding: 12px; font-size: 13px;">تأكيد وإرسال الطلب عبر واتساب 📱</button>
            <button onclick="closeModal()" style="background: transparent; border: none; color: var(--text-muted); width: 100%; font-size: 11px; cursor: pointer; margin-top: 10px;">إلغاء والتراجع</button>
        </div>
    </div>

    <div class="cart-bar">
        <div class="cart-info">الإجمالي: <span id="cartTotal">0</span> ج.م (<span id="cartCount">0</span> منتجات)</div>
        <button class="whatsapp-checkout-btn" onclick="openModal()">إتمام الشراء 🛍️</button>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('store_products')) || [
            { id: 1, name: 'سماعات لاسلكية برو', desc: 'صوت نقي عالي الأداء وعزل ضوضاء ممتاز.', price: 850, discount: '29%', image: '', reviews: [{name: 'محمود', text: 'حقيقي تحفة وصوته نقي جدا ⭐⭐⭐⭐⭐'}] },
            { id: 2, name: 'ساعة ذكية رياضية', desc: 'تتبع نبضات القلب بدقة وشاشة HD كاملة باللمس.', price: 1450, discount: '23%', image: '', reviews: [] }
        ];

        let cart = {};

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                let mediaContent = `<div style="font-size: 40px;">📦</div>`;
                if (p.image) {
                    if (p.image.includes('.mp4') || p.image.includes('video')) {
                        mediaContent = `<video src="${p.image}" autoplay muted loop></video>`;
                    } else {
                        mediaContent = `<img src="${p.image}" alt="${p.name}">`;
                    }
                }

                let reviewsHtml = p.reviews && p.reviews.length > 0 
                    ? p.reviews.map(r => `<div class="review-item"><strong>${r.name}:</strong> ${r.text}</div>`).join('') 
                    : `<div style="font-size: 10px; color: #888;">لا توجد تقييمات بعد. كن أول من يكتب رأيه!</div>`;

                return `
                <div class="card">
                    <div class="card-media">
                        <span class="badge">خصم ${p.discount || '0%'}</span>
                        ${mediaContent}
                    </div>
                    <h3>${p.name}</h3>
                    <p>${p.desc}</p>
                    <div class="price-row">
                        <span class="price">${p.price} ج.م</span>
                        <button class="btn" onclick="updateCart(${p.id}, 1)">+ إضافة للسلة</button>
                    </div>

                    <!-- قسم التقييمات الآراء (مثل أمازون) -->
                    <div class="reviews-section">
                        <div class="reviews-title">⭐ تقييمات وآراء العملاء</div>
                        <div class="review-list">${reviewsHtml}</div>
                        <div class="review-input-group">
                            <input type="text" id="revName_${p.id}" placeholder="اسمك">
                            <input type="text" id="revText_${p.id}" placeholder="اكتب رأيك...">
                            <button onclick="addReview(${p.id})">نشر</button>
                        </div>
                    </div>
                </div>
            `;}).join('');
        }

        function addReview(productId) {
            const nameInput = document.getElementById(`revName_${productId}`).value;
            const textInput = document.getElementById(`revText_${productId}`).value;
            
            if (!nameInput || !textInput) {
                alert("يرجى كتابة اسمك ورأيك في المنتج أولاً.");
                return;
            }

            let product = products.find(p => p.id === productId);
            if (!product.reviews) product.reviews = [];
            product.reviews.push({ name: nameInput, text: textInput });
            
            localStorage.setItem('store_products', JSON.stringify(products));
            renderProducts();
            alert("تم نشر رأيك بنجاح، شكراً لك! ✨");
        }

        function updateCart(productId, change) {
            if (!cart[productId]) cart[productId] = 0;
            cart[productId] += change;
            if (cart[productId] <= 0) delete cart[productId];
            updateUI();
        }

        function updateUI() {
            let totalCount = 0; let totalPrice = 0;
            for (let id in cart) {
                let prod = products.find(p => p.id == id);
                if (prod) { totalCount += cart[id]; totalPrice += prod.price * cart[id]; }
            }
            document.getElementById('cartCount').innerText = totalCount;
            document.getElementById('cartTotal').innerText = totalPrice;
        }

        function openModal() {
            let totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
            if (totalCount === 0) { 
                alert('سلة الشراء فارغة، يجدر بك اختيار منتج أولاً!'); 
                return; 
            }
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() { 
            document.getElementById('checkoutModal').style.display = 'none'; 
        }

        function submitOrder() {
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const city = document.getElementById('cCity').value;
            const address = document.getElementById('cAddress').value;

            if (!name || !phone || !city || !address) { 
                alert('الرجاء إدخال بيانات التوصيل والمحافظة كاملة بدقة.'); 
                return; 
            }

            let itemsTxt = ""; let totalPrice = 0;
            for (let id in cart) {
                let prod = products.find(p => p.id == id);
                if (prod) { 
                    itemsTxt += `▪️ ${prod.name} (العدد: ${cart[id]}) - ${prod.price * cart[id]} ج.م\n`; 
                    totalPrice += prod.price * cart[id]; 
                }
            }

            let message = `🛒 طلب شراء جديد من المتجر:\n\n👤 الاسم: ${name}\n📞 الهاتف: ${phone}\n📍 المحافظة: ${city}\n🏠 العنوان: ${address}\n\n📦 المنتجات المطلوبة:\n${itemsTxt}\n💰 الإجمالي الكلي: ${totalPrice} ج.م`;
            
            let url = `https://wa.me/201000000000?text=` + encodeURIComponent(message);
            closeModal();
            window.open(url, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
