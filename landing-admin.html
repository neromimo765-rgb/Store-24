<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم صفحات الهبوط</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #181824;
            --accent-gold: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
            --info: #3B82F6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; padding: 16px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }
        header h1 { font-size: 15px; color: var(--accent-gold); font-weight: 800; }
        .nav-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; text-decoration: none;
        }
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
        }
        .card h2 { font-size: 14px; color: var(--accent-gold); margin-bottom: 12px; font-weight: bold; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        .form-control {
            width: 100%; background: #0f0f13; border: 1px solid var(--border-color);
            color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; outline: none;
        }
        .form-control:focus { border-color: var(--accent-gold); }
        .btn {
            width: 100%; background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #000; border: none; padding: 12px; border-radius: 8px;
            font-weight: 900; font-size: 13px; cursor: pointer; margin-top: 5px;
        }
        .btn-cancel { background: var(--text-muted); color: #000; display: none; }
        .item-card {
            background: #0f0f13; border: 1px solid var(--border-color);
            border-radius: 10px; padding: 12px; margin-bottom: 12px;
        }
        .item-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #fff; }
        .item-info { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
        .landing-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .landing-action-btn { padding: 6px 2px; border-radius: 6px; font-size: 10px; font-weight: bold; border: none; cursor: pointer; text-align: center; color: #fff; }
        .btn-edit { background: var(--info); }
        .btn-copy { background: #6366F1; }
        .btn-preview { background: var(--accent-gold); color: #000; }
        .btn-delete { background: var(--accent-red); }
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 16, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 2000;
            flex-direction: column; color: var(--accent-gold); font-size: 13px; font-weight: bold;
        }
        .spinner {
            width: 35px; height: 35px; border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <span>جاري حفظ صفحة الهبوط...</span>
    </div>

    <div class="container">
        <header>
            <h1>🚀 لوحة صفحات الهبوط</h1>
            <!-- تم تعديل الرابط هنا ليتطابق تماماً مع اسم الملف الجديد control.html -->
            <a href="control.html" class="nav-btn">لوحة المتجر 🛒</a>
        </header>

        <div class="card">
            <h2 id="landingFormTitle">➕ إنشاء صفحة هبوط مستقلة</h2>
            <input type="hidden" id="editingLandingId" value="">

            <div class="form-group">
                <label>عنوان العرض:</label>
                <input type="text" id="landingTitle" class="form-control" placeholder="مثال: عرض خاص ومحدود...">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                    <label>السعر الأساسي:</label>
                    <input type="number" id="landingPrice" class="form-control" placeholder="250">
                </div>
                <div class="form-group">
                    <label>سعر الخصم (اختياري):</label>
                    <input type="number" id="landingDiscountPrice" class="form-control" placeholder="اختياري">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                    <label>العملة:</label>
                    <select id="landingCurrency" class="form-control">
                        <option value="EGP">ج.م (EGP)</option>
                        <option value="SAR">ر.س (SAR)</option>
                        <option value="USD">$ (USD)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>وقت العداد:</label>
                    <input type="text" id="landingTimer" class="form-control" value="02:45:00">
                </div>
            </div>

            <div class="form-group">
                <label>صورة صفحة الهبوط (اختيارية):</label>
                <input type="file" id="landingImageFile" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
                <label>فيديو صفحة الهبوط (اختياري):</label>
                <input type="file" id="landingVideoFile" class="form-control" accept="video/*">
            </div>

            <div class="form-group">
                <label>تفاصيل العرض:</label>
                <textarea id="landingDesc" class="form-control" rows="3" placeholder="مميزات العرض..."></textarea>
            </div>

            <button onclick="saveLanding()" id="landingSubmitBtn" class="btn">حفظ وإنشاء صفحة الهبوط ⚡</button>
            <button onclick="resetLandingForm()" id="landingCancelBtn" class="btn btn-cancel">إلغاء التعديل</button>
        </div>

        <div class="card">
            <h2>📑 صفحات الهبوط المضافة</h2>
            <div id="landingsList">
                <p style="text-align: center; color: var(--text-muted); font-size: 11px;">لا توجد صفحات هبوط.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        window.saveLanding = async function() {
            const editingId = document.getElementById('editingLandingId').value;
            const title = document.getElementById('landingTitle').value.trim();
            const price = document.getElementById('landingPrice').value.trim();
            const discountPrice = document.getElementById('landingDiscountPrice').value.trim();
            const currency = document.getElementById('landingCurrency').value;
            const timer = document.getElementById('landingTimer').value.trim() || "02:45:00";
            const imageFile = document.getElementById('landingImageFile').files[0];
            const videoFile = document.getElementById('landingVideoFile').files[0];
            const desc = document.getElementById('landingDesc').value.trim();

            if (!title || !price) {
                alert('الرجاء كتابة العنوان والسعر الأساسي.');
                return;
            }

            document.getElementById('loadingOverlay').style.display = 'flex';

            try {
                let landingData = { 
                    title, 
                    price, 
                    oldPrice: discountPrice ? discountPrice : '', 
                    currency, 
                    timer, 
                    desc 
                };

                if (imageFile) landingData.imageUrl = await fileToBase64(imageFile);
                if (videoFile) landingData.videoUrl = await fileToBase64(videoFile);

                if (editingId) {
                    await update(ref(db, 'landings/' + editingId), landingData);
                    alert('تم تحديث صفحة الهبوط بنجاح!');
                } else {
                    await push(ref(db, 'landings'), { ...landingData, createdAt: Date.now() });
                    alert('تم إنشاء صفحة الهبوط بنجاح!');
                }

                resetLandingForm();
                loadLandings();
            } catch (e) {
                alert('حدث خطأ أثناء معالجة الملفات.');
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        async function loadLandings() {
            try {
                const snap = await get(ref(db, 'landings'));
                const container = document.getElementById('landingsList');
                if (!snap.exists()) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 11px;">لا توجد صفحات هبوط.</p>`;
                    return;
                }
                let html = '';
                const landings = snap.val();
                for (let id in landings) {
                    const l = landings[id];
                    const encoded = encodeURIComponent(JSON.stringify({ id, ...l }));
                    html += `
                        <div class="item-card">
                            <div class="item-title">${l.title}</div>
                            <div class="item-info">السعر: ${l.price} ${l.currency || 'EGP'}</div>
                            <div class="landing-actions">
                                <button onclick="editLanding('${encoded}')" class="landing-action-btn btn-edit">تعديل</button>
                                <button onclick="copyLink('${id}')" class="landing-action-btn btn-copy">نسخ</button>
                                <button onclick="previewLink('${id}')" class="landing-action-btn btn-preview">معاينة</button>
                                <button onclick="deleteLanding('${id}')" class="landing-action-btn btn-delete">حذف</button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (e) { console.error(e); }
        }

        window.editLanding = function(encodedData) {
            const data = JSON.parse(decodeURIComponent(encodedData));
            document.getElementById('editingLandingId').value = data.id;
            document.getElementById('landingTitle').value = data.title || '';
            document.getElementById('landingPrice').value = data.price || '';
            document.getElementById('landingDiscountPrice').value = data.oldPrice || '';
            document.getElementById('landingCurrency').value = data.currency || 'EGP';
            document.getElementById('landingTimer').value = data.timer || '02:45:00';
            document.getElementById('landingDesc').value = data.desc || '';

            document.getElementById('landingFormTitle').innerText = '✏️ تعديل صفحة الهبوط';
            document.getElementById('landingSubmitBtn').innerText = 'تحديث صفحة الهبوط 🔄';
            document.getElementById('landingCancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetLandingForm = function() {
            document.getElementById('editingLandingId').value = '';
            document.getElementById('landingTitle').value = '';
            document.getElementById('landingPrice').value = '';
            document.getElementById('landingDiscountPrice').value = '';
            document.getElementById('landingTimer').value = '02:45:00';
            document.getElementById('landingImageFile').value = '';
            document.getElementById('landingVideoFile').value = '';
            document.getElementById('landingDesc').value = '';

            document.getElementById('landingFormTitle').innerText = '➕ إنشاء صفحة هبوط مستقلة';
            document.getElementById('landingSubmitBtn').innerText = 'حفظ وإنشاء صفحة الهبوط ⚡';
            document.getElementById('landingCancelBtn').style.display = 'none';
        }

        window.copyLink = function(id) {
            const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            const link = baseUrl + 'landing.html?id=' + id;
            navigator.clipboard.writeText(link);
            alert('تم نسخ الرابط بنجاح وسيعمل على أي هاتف بدون أخطاء!');
        }

        window.previewLink = function(id) {
            const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            window.open(baseUrl + 'landing.html?id=' + id, '_blank');
        }

        window.deleteLanding = async function(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await remove(ref(db, 'landings/' + id));
                loadLandings();
            }
        }

        window.addEventListener('DOMContentLoaded', loadLandings);
    </script>
</body>
</html>
