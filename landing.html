<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض خاص | صفحة الهبوط</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #181824;
            --accent-gold: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; padding: 16px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .title { font-size: 18px; color: var(--accent-gold); font-weight: 800; margin-bottom: 12px; text-align: center; line-height: 1.4; }
        
        .media-container { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; background: #000; text-align: center; }
        .media-container img, .media-container video { width: 100%; max-height: 350px; object-fit: contain; display: block; }

        .price-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--accent-gold);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .current-price { font-size: 20px; font-weight: 900; color: var(--success); }
        .old-price { font-size: 14px; color: var(--text-muted); text-decoration: line-through; }

        .timer-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        .form-control {
            width: 100%; background: #0f0f13; border: 1px solid var(--border-color);
            color: #fff; padding: 12px; border-radius: 8px; font-size: 13px; outline: none;
        }
        .form-control:focus { border-color: var(--accent-gold); }

        .btn-order {
            width: 100%; background: linear-gradient(135deg, #10B981, #059669);
            color: #fff; border: none; padding: 14px; border-radius: 8px;
            font-weight: 900; font-size: 15px; cursor: pointer; text-align: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        #loadingState, #errorState {
            text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loadingState">
            <p>جاري تحميل تفاصيل العرض من قاعدة البيانات... ⏳</p>
        </div>

        <div id="errorState" style="display: none;">
            <h2 style="color: var(--accent-red); margin-bottom: 10px;">عذراً، لم يتم العثور على الصفحة!</h2>
            <p>تأكد من صحة الرابط أو أن المنتج لم يتم حذفه من لوحة التحكم.</p>
        </div>

        <div id="landingContent" style="display: none;">
            <div class="card">
                <h1 class="title" id="pTitle"></h1>
                
                <div class="media-container" id="mediaBox" style="display: none;"></div>

                <div class="price-box">
                    <div>السعر: <span class="current-price" id="pPrice"></span> <span id="pCurrency"></span></div>
                    <div id="oldPriceWrapper" style="display: none;">قبل الخصم: <span class="old-price" id="pOldPrice"></span></div>
                </div>

                <div class="timer-box">
                    ⏱️ العرض ينتهي خلال: <span id="pTimer">02:45:00</span>
                </div>

                <div class="desc" id="pDesc"></div>
            </div>

            <div class="card">
                <h2 style="font-size: 14px; color: var(--accent-gold); margin-bottom: 12px; font-weight: bold;">🛒 اطلب المنتج الآن (الدفع عند الاستلام)</h2>
                <div class="form-group">
                    <label>الاسم بالكامل:</label>
                    <input type="text" id="clientName" class="form-control" placeholder="اكتب اسمك هنا...">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف (للاستهداف والتأكيد):</label>
                    <input type="tel" id="clientPhone" class="form-control" placeholder="01xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل:</label>
                    <textarea id="clientAddress" class="form-control" rows="2" placeholder="المحافظة، المنطقة، الشارع، رقم الحلة..."></textarea>
                </div>
                <button onclick="submitOrder()" class="btn-order">تأكيد طلب المنتج 🚀</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // التقاط الـ ID الموجود في الرابط (مثل ?id=123)
        const urlParams = new URLSearchParams(window.location.search);
        const landingId = urlParams.get('id');

        async function loadLandingData() {
            if (!landingId) {
                showError();
                return;
            }

            try {
                const snapshot = await get(ref(db, 'landings/' + landingId));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    document.getElementById('pTitle').innerText = data.title || '';
                    document.getElementById('pPrice').innerText = data.price || '';
                    document.getElementById('pCurrency').innerText = data.currency || 'EGP';
                    document.getElementById('pTimer').innerText = data.timer || '02:45:00';
                    document.getElementById('pDesc').innerText = data.desc || '';

                    // معالجة "سعر الخصم الاختياري" بحرية تامة وبدون أخطاء
                    if (data.oldPrice && data.oldPrice.trim() !== '') {
                        document.getElementById('pOldPrice').innerText = data.oldPrice + ' ' + (data.currency || 'EGP');
                        document.getElementById('oldPriceWrapper').style.display = 'block';
                    } else {
                        document.getElementById('oldPriceWrapper').style.display = 'none'; // لو مش مكتوب هيختفي بسلاسة
                    }

                    // عرض الصورة أو الفيديو إن وجدوا
                    const mediaBox = document.getElementById('mediaBox');
                    let mediaHtml = '';
                    if (data.imageUrl) {
                        mediaHtml += `<img src="${data.imageUrl}" alt="صورة المنتج">`;
                    }
                    if (data.videoUrl) {
                        mediaHtml += `<video src="${data.videoUrl}" controls autoplay muted></video>`;
                    }
                    if (mediaHtml) {
                        mediaBox.innerHTML = mediaHtml;
                        mediaBox.style.display = 'block';
                    }

                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('landingContent').style.display = 'block';
                } else {
                    showError();
                }
            } catch (error) {
                console.error(error);
                showError();
            }
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        window.submitOrder = async function() {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const address = document.getElementById('clientAddress').value.trim();

            if (!name || !phone || !address) {
                alert('الرجاء إدخال الاسم، رقم الهاتف، والعنوان بالتفصيل.');
                return;
            }

            try {
                await push(ref(db, 'orders'), {
                    landingId: landingId,
                    clientName: name,
                    clientPhone: phone,
                    clientAddress: address,
                    orderDate: Date.now()
                });
                alert('🎉 تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً لتأكيد الشحن.');
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                document.getElementById('clientAddress').value = '';
            } catch (e) {
                alert('حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى.');
            }
        }

        loadLandingData();
    </script>
</body>
</html>
