<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض خاص | متجرنا</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #181824;
            --accent-gold: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; }

        /* شريط العداد التنازلي الاحترافي */
        .urgency-banner {
            background: linear-gradient(135deg, #DC2626, #991B1B);
            color: #fff;
            padding: 10px 15px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .timer-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .content-padding { padding: 16px; }

        /* تقييمات العملاء */
        .ratings { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 11px; color: var(--text-muted); }
        .stars { color: #FBBF24; font-size: 12px; }

        /* عنوان المنتج */
        .product-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        /* حاوية الوسائط (صور وفيديوهات) */
        .media-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            position: relative;
        }
        .media-container img, .media-container video {
            width: 100%;
            display: block;
            object-fit: cover;
            max-height: 400px;
        }

        /* قسم الأسعار الفاخر */
        .price-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .price-wrapper { display: flex; align-items: baseline; gap: 8px; }
        .current-price { font-size: 22px; font-weight: 900; color: var(--accent-gold); }
        .old-price { font-size: 14px; color: var(--text-muted); text-decoration: line-through; }
        .discount-badge {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        /* صندوق الوصف والمميزات */
        .description-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #E5E7EB;
        }
        .description-card h3 { color: var(--accent-gold); font-size: 14px; margin-bottom: 8px; font-weight: bold; }
        .description-card ul { padding-right: 18px; margin-top: 8px; }
        .description-card li { margin-bottom: 6px; }

        /* شارات الثقة */
        .trust-badges {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .trust-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 6px;
            border-radius: 8px;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
        }
        .trust-item span { display: block; font-size: 16px; margin-bottom: 4px; }

        /* نموذج الطلب الاحترافي */
        .order-form-card {
            background: var(--bg-card);
            border: 1px solid var(--accent-gold);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.15);
        }
        .order-form-card h2 {
            color: var(--accent-gold);
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 800;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        .form-control {
            width: 100%;
            background: #0f0f13;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--accent-gold); }
        
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s;
            margin-top: 5px;
        }
        .submit-btn:active { transform: scale(0.98); }

        /* شاشة التحميل والنجاح */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 16, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 2000;
            flex-direction: column; color: var(--accent-gold); font-size: 14px; font-weight: bold;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .success-box {
            display: none;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--success);
            padding: 30px 20px;
            border-radius: 14px;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <span>جاري تأكيد طلبك وإرساله بنجاح...</span>
    </div>

    <div class="container">
        <!-- شريط العرض والعداد المتحرك -->
        <div class="urgency-banner">
            <span>🔥 العرض ينتهي خلال:</span>
            <div class="timer-box" id="liveTimer">02:45:00</div>
        </div>

        <div class="content-padding" id="mainContent">
            <!-- سيتم تعبئة البيانات هنا ديناميكياً من قاعدة البيانات -->
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">جاري تحميل تفاصيل العرض...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyASmcV2bPzFjiwRAGxDr2kCbthG6b0h2lg",
          authDomain: "store-24-4df16.firebaseapp.com",
          databaseURL: "https://store-24-4df16-default-rtdb.firebaseio.com",
          projectId: "store-24-4df16",
          storageBucket: "store-24-4df16.firebasestorage.app",
          messagingSenderId: "81493388397",
          appId: "1:81493388397:web:920f9dbe1f080638ebe364",
          measurementId: "G-WEM3CVD7CQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function getCurrencySymbol(code) {
            if (code === 'USD') return '$';
            if (code === 'SAR') return 'ر.س';
            return 'ج.م';
        }

        // تشغيل العداد التنازلي الحقيقي المتحرك
        function startCountdown(durationStr) {
            let [hours, minutes, seconds] = durationStr.split(':').map(Number);
            let totalSeconds = (hours || 0) * 3600 + (minutes || 0) * 60 + (seconds || 0);
            if (isNaN(totalSeconds) || totalSeconds <= 0) totalSeconds = 9900; // افتدري 2:45:00

            const timerElement = document.getElementById('liveTimer');
            if (!timerElement) return;

            const interval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(interval);
                    timerElement.innerText = "00:00:00";
                    return;
                }
                totalSeconds--;
                let h = Math.floor(totalSeconds / 3600);
                let m = Math.floor((totalSeconds % 3600) / 60);
                let s = totalSeconds % 60;
                timerElement.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        async function loadLandingData() {
            const urlParams = new URLSearchParams(window.location.search);
            const landingId = urlParams.get('id');

            if (!landingId) {
                document.getElementById('mainContent').innerHTML = `<p style="text-align:center; color:var(--accent-red);">رابط العرض غير صالح أو غير موجود.</p>`;
                return;
            }

            try {
                const snapshot = await get(ref(db, 'landings/' + landingId));
                if (!snapshot.exists()) {
                    document.getElementById('mainContent').innerHTML = `<p style="text-align:center; color:var(--accent-red);">عذراً، هذا العرض لم يعد متوفراً أو تم حذفه.</p>`;
                    return;
                }

                const l = snapshot.val();
                const curSym = getCurrencySymbol(l.currency);

                // حساب نسبة الخصم تلقائياً إذا وجد السعر القديم والجديد
                let discountPercentage = '';
                if (l.price && l.oldPrice && Number(l.oldPrice) > Number(l.price)) {
                    const diff = Number(l.oldPrice) - Number(l.price);
                    const pct = Math.round((diff / Number(l.oldPrice)) * 100);
                    discountPercentage = `خصم ${pct}%`;
                }

                // بناء محتوى الصفحة بشكل احترافي للغاية
                let mediaHtml = '';
                if (l.imageUrl) {
                    mediaHtml += `<div class="media-container"><img src="${l.imageUrl}" alt="${l.title}"></div>`;
                }
                if (l.videoUrl) {
                    mediaHtml += `<div class="media-container"><video src="${l.videoUrl}" controls autoplay muted loop></video></div>`;
                }

                document.getElementById('mainContent').innerHTML = `
                    <div class="ratings">
                        <div class="stars">⭐⭐⭐⭐⭐</div>
                        <span>(أكثر من 500 عميل راضٍ عن المنتج)</span>
                    </div>

                    <h1 class="product-title">${l.title}</h1>

                    ${mediaHtml}

                    <div class="price-section">
                        <div class="price-wrapper">
                            <span class="current-price">${l.price ? l.price + ' ' + curSym : 'حسب الطلب'}</span>
                            ${l.oldPrice ? `<span class="old-price">${l.oldPrice} ${curSym}</span>` : ''}
                        </div>
                        ${discountPercentage ? `<span class="discount-badge">🔥 ${discountPercentage}</span>` : ''}
                    </div>

                    ${l.desc ? `
                        <div class="description-card">
                            <h3>📌 تفاصيل ومميزات العرض:</h3>
                            <p style="white-space: pre-line;">${l.desc}</p>
                        </div>
                    ` : ''}

                    <div class="trust-badges">
                        <div class="trust-item"><span>🛡️</span>ضمان الجودة</div>
                        <div class="trust-item"><span>🚀</span>توصيل سريع</div>
                        <div class="trust-item"><span>💵</span>الدفع عند الاستلام</div>
                    </div>

                    <div class="order-form-card" id="formCard">
                        <h2>🛒 اطلب العرض الآن (الدفع عند الاستلام)</h2>
                        <div class="form-group">
                            <label>الاسم الكامل (إلزامي):</label>
                            <input type="text" id="clientName" class="form-control" placeholder="اكتب اسمك الثلاثي...">
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف المحمول (إلزامي):</label>
                            <input type="tel" id="clientPhone" class="form-control" placeholder="اكتب رقم هاتفك للتواصل معك...">
                        </div>
                        <div class="form-group">
                            <label>العنوان بالتفصيل (المدينة / المنطقة / الشارع):</label>
                            <input type="text" id="clientAddress" class="form-control" placeholder="اكتب عنوانك بالتفصيل لتسهيل التوصيل...">
                        </div>
                        <button onclick="submitOrder('${l.title}')" class="submit-btn">تأكيد وإرسال الطلب 🚀</button>
                    </div>

                    <div class="success-box" id="successBox">
                        <div style="font-size: 40px; margin-bottom: 10px;">🎉</div>
                        <h2 style="color: var(--success); font-size: 18px; margin-bottom: 8px;">تم استلام طلبك بنجاح!</h2>
                        <p style="color: var(--text-muted); font-size: 12px; line-height: 1.5;">شكراً لثقتك بنا. سيقوم فريق خدمة العملاء بالتواصل معك عبر الهاتف قريباً لتأكيد تفاصيل الشحن والتوصيل.</p>
                    </div>
                `;

                // تفعيل العداد المتحرك
                startCountdown(l.timer || "02:45:00");

            } catch (err) {
                console.error(err);
                document.getElementById('mainContent').innerHTML = `<p style="text-align:center; color:var(--accent-red);">حدث خطأ في تحميل الصفحة.</p>`;
            }
        }

        window.submitOrder = async function(productTitle) {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const address = document.getElementById('clientAddress').value.trim();

            if (!name || !phone || !address) {
                alert('الرجاء تعبئة جميع الحقول (الاسم، رقم الهاتف، العنوان) لإتمام الطلب.');
                return;
            }

            document.getElementById('loadingOverlay').style.display = 'flex';

            try {
                // حفظ الطلب في قاعدة البيانات وتحسين عداد المبيعات
                await push(ref(db, 'orders'), {
                    productTitle,
                    name,
                    phone,
                    address,
                    createdAt: Date.now()
                });

                // تحديث إحصائيات المبيعات الحقيقية في لوحة التحكم
                const analyticsRef = ref(db, 'analytics/orders');
                const snapshot = await get(analyticsRef);
                const currentOrders = snapshot.exists() ? snapshot.val() : 0;
                await set(analyticsRef, currentOrders + 1);

                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('formCard').style.display = 'none';
                document.getElementById('successBox').style.display = 'block';

            } catch (err) {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.');
            }
        }

        window.addEventListener('DOMContentLoaded', loadLandingData);
    </script>
</body>
</html>
